<style>
/* Vanilla supplies the type, the theme colours and the button, chip, tab and
   card patterns; what follows maps the page's own tokens onto its theme and
   lays the page out.  Neutrals all come from Vanilla, so they follow its
   light and dark themes without being restated here.  The series hues do
   not: each mode's are their own steps, validated against that mode's
   surface (see AGENTS.md), so they are set per theme below. */
:root {
  color-scheme: light;
  --page:           var(--vf-color-background-default);
  --surface:        var(--vf-color-background-default);
  --text-primary:   var(--vf-color-text-default);
  --text-secondary: var(--vf-color-text-inactive);
  --muted:          var(--vf-color-text-muted);
  --grid:           var(--vf-color-border-low-contrast);
  --axis:           var(--vf-color-border-default);
  --border:         var(--vf-color-border-default);
  --neutral-fill:   rgba(0,0,0,0.12);
  --accent:         #e95420;
  /* Ubuntu orange, Vanilla's link blue and positive green lead, so the series
     most often on screen wear the brand. */
  --s1: #e95420; --s2: #0066cc; --s3: #0e8420; --s4: #ef79d5;
  --s5: #a2399c; --s6: #aab51b; --s7: #22b4d1; --s8: #853900;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --is-dark: 1;
    --neutral-fill: rgba(255,255,255,0.16);
    --s1: #e95420; --s2: #287ee7; --s3: #269230; --s4: #d561bd;
    --s5: #952b8f; --s6: #939d12; --s7: #02a0bb; --s8: #a25325;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --is-dark: 1;
  --neutral-fill: rgba(255,255,255,0.16);
  --s1: #e95420; --s2: #287ee7; --s3: #269230; --s4: #d561bd;
  --s5: #952b8f; --s6: #939d12; --s7: #02a0bb; --s8: #a25325;
}

body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font-size: 14px; line-height: 1.5;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 64px; }
/* The orange rule is the one piece of brand chrome the page carries: the
   same strip that heads ubuntu.com and vanillaframework.io. */
.wrap::before {

}

h1 {
  font-size: 32px; line-height: 40px; margin: 0; padding: 0;
  font-weight: 180; max-width: none;
}
.sub { color: var(--text-secondary); font-size: 13px; }
.spacer { flex: 1; }
/* Vanilla margins every button as if it ended a paragraph; here they sit in
   rows that space themselves with gap. */
header .p-button, .card h2 .p-button { margin: 0; }
.frow .summary { margin: 0; font-size: 13px; text-align: left; white-space: normal; }

.tiles { display: flex; gap: 0; flex-wrap: wrap; margin: 24px 0 8px; }
/* Vanilla's data-spotlight look: figures set light and large, separated by
   a rule rather than boxed. */
.tile {
  border-top: 1px solid var(--border); padding: 8px 24px 12px 0;
  min-width: 190px; flex: 1;
}
.tile.primary { border-top: 3px solid var(--text-primary); padding-top: 6px; }
.tile .label {
  color: var(--text-secondary); font-size: 12px; letter-spacing: 0.05em;
  font-weight: 550;
}
.tile .value { font-size: 32px; line-height: 40px; font-weight: 180; margin-top: 4px; }
.tile.primary .value { font-size: 42px; line-height: 48px; font-weight: 180; }

}

.frow > .flabel {

}

}

.chip.allnone { font-size: 12px; color: var(--text-secondary); }

.tabs.p-tabs__list { margin-bottom: 24px; }
.tab.p-tabs__link { margin: 0; font-size: 15px; }

.card.p-card { padding: 18px 20px 14px; margin-bottom: 24px; border-width: 1px; }
.card h2 {
  font-size: 16px; line-height: 24px; font-weight: 550; margin: 0 0 2px;
  padding: 0; max-width: none;

}

.legend .key { width: 10px; height: 10px; flex: none; }
/* Used when a legend has dashed entries: a line reads as a line. */
.legend .key.line { width: 18px; height: 3px; }

/* Vanilla fixes the layout and clips cells with an ellipsis, which suits
   prose tables; these are columns of figures that must never be cut. */
table { table-layout: auto; margin-bottom: 0; font-size: 13px; }
th, td {
  text-align: right; padding: 5px 10px; overflow: visible;
  border-bottom: 1px solid var(--grid);
}
th:first-child, td:first-child { text-align: left; }
thead th {
  color: var(--text-secondary); font-weight: 550; font-size: 12px;
  letter-spacing: 0.05em; padding: 6px 10px;
}

tr.total td { font-weight: 550; border-top: 1px solid var(--axis); }
.tablewrap { overflow-x: auto; }

.tooltip {
  position: fixed; pointer-events: none; z-index: 20; opacity: 0;
  background: var(--surface); border: 1px solid var(--border);
  padding: 8px 10px; font-size: 12px;
  box-shadow: 0 1px 5px 1px rgba(0,0,0,0.2); transition: opacity .08s;
  max-width: 280px;
}
.tooltip .tt-title { font-weight: 550; margin-bottom: 4px; }
.tooltip .tt-row { display: flex; gap: 10px; justify-content: space-between; }
.tooltip .tt-row span:last-child { font-variant-numeric: tabular-nums; }

.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input[type=range] { flex: 1; margin: 0; }
/* Vanilla leaves the track to its slider script, which the page does not
   carry, so in Chromium it is not drawn at all.  The input paints its own:
   the high-contrast border colour, filled up to the thumb in link blue,
   with the fill's width set from script.  Firefox's own track and progress
   are cleared so that both engines draw this one. */
.slider-row input[type=range] {
  background: linear-gradient(var(--vf-color-link-default),
                              var(--vf-color-link-default)) 0 / 0 100% no-repeat,
              var(--vf-color-border-high-contrast);
}
.slider-row input[type=range]::-moz-range-track,
.slider-row input[type=range]::-moz-range-progress { background: transparent; }
.slider-row .stamp { font-variant-numeric: tabular-nums; color: var(--text-secondary); min-width: 74px; }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }
footer {
  color: var(--muted); font-size: 13px; margin-top: 32px; line-height: 1.7;

}
footer details { margin-bottom: 10px; overflow: visible; }
footer summary {

footer summary:hover { color: var(--text-primary); }
footer details p { margin: 10px 0 0; padding: 0; max-width: 78ch; font-size: 13px; line-height: 1.7; }
code { font-size: 12px; padding: 0 3px; }

<script>
const PAYLOAD = /*DATA*/null/*DATA*/;

/** Rebuild the tables from the packed blob.
 *
 * The dataset is one JSON header plus a gzipped, base64'd column store, which
 * is about eight times smaller than the same numbers as a JavaScript literal
 * and, unlike a literal, does not have to be parsed by the JS parser before
 * anything can be drawn.  Each table comes back as one flat Float64Array in
 * row-major order, exactly the shape the scans below already index.  Float64
 * rather than Int32 because the size columns run past four billion; the key
 * columns are small enough that the bitwise filters still work on them.
 */
async function loadData() {
  // Not Uint8Array.from(s, cb): the per-byte callback costs more than the
  // whole gunzip that follows it.
  const bin = atob(PAYLOAD.blob);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (typeof DecompressionStream !== "function") {
    throw new Error("this browser has no DecompressionStream");
  }
  const buf = new Uint8Array(await new Response(
    new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))
  ).arrayBuffer());

  let p = 0;
  const out = {
    generated: PAYLOAD.generated, otherClass: PAYLOAD.otherClass,
    pockets: PAYLOAD.pockets, dims: PAYLOAD.dims,
    mirrored: PAYLOAD.mirrored, liveSeries: PAYLOAD.liveSeries,
    mirrorRemoved: PAYLOAD.mirrorRemoved,
  };
  for (const t of PAYLOAD.tables) {
    const n = t.rows, stride = t.stride;
    const rows = new Float64Array(n * stride);
    for (let c = 0; c < stride; c++) {
      if (c < t.keys) {
        // Keys and their deltas are all far inside 32 bits, so this stays on
        // the integer path: shifts to accumulate, and a branchless zigzag.
        let prev = 0;
        for (let i = 0, o = c; i < n; i++, o += stride) {
          let b = buf[p++], v = b & 0x7f, sh = 7;
          while (b & 0x80) { b = buf[p++]; v |= (b & 0x7f) << sh; sh += 7; }
          prev += (v >>> 1) ^ -(v & 1);
          rows[o] = prev;
        }
      } else {
        // Measurements run past 2^32, so the first four groups are unrolled
        // on the integer path and anything wider falls through to floats.
        for (let i = 0, o = c; i < n; i++, o += stride) {
          let b = buf[p++], v = b & 0x7f;
          if (b & 0x80) {
            b = buf[p++]; v |= (b & 0x7f) << 7;
            if (b & 0x80) {
              b = buf[p++]; v |= (b & 0x7f) << 14;
              if (b & 0x80) {
                b = buf[p++]; v |= (b & 0x7f) << 21;
                if (b & 0x80) {
                  let scale = 268435456;                  // 2 ** 28
                  do {
                    b = buf[p++];
                    v += (b & 0x7f) * scale;
                    scale *= 128;
                  } while (b & 0x80);
                }
              }
            }
          }
          rows[o] = v;
        }
      }
    }
    out[t.name] = { stride: stride, rows: rows };
  }
  return out;
}
</script>
<script>
(async function () {
"use strict";

let DATA;
try {
  DATA = await loadData();
} catch (err) {
  document.getElementById("views").innerHTML =
    '<div class="card p-card"><h2>Could not read the dataset</h2><p>' +
    String(err && err.message ? err.message : err) + "</p></div>";
  return;
}

const D = DATA.dims;
const OTHER = D.classes.indexOf(DATA.otherClass);
// Hues in the categorical palette.  A selection wider than this reuses them,
// each repeat carrying a different dash -- see Slots below.
const SLOTS = 8;

// Colour follows the entity, not its rank: once a key holds a slot it keeps it
// until deselected, so filtering never repaints the survivors.
//
// A selection wider than the palette reuses the hues rather than leaving the
// extras undrawn, which is what the mirror asks for -- it carries ten series
// and there are eight hues, and a series you cannot see is worse than one
// sharing a colour.  What stops a repeat being ambiguous is that it is a
// different dash, so identity is the pair and never the hue alone.
/** Slots, in the order keys should claim them.
 *
 *  `first` decides who gets a plain hue when there are more keys than hues,
 *  since the dashed repeats come last.  It is a fixed order over the keys
 *  themselves, not over their values, so it is still true that colour follows
 *  the entity and never its rank: a filter that changes the selection cannot
 *  repaint a survivor.
 */
function Slots(first) { this.map = new Map(); this.first = first; }

Slots.prototype.assign = function (selected) {
  for (const k of [...this.map.keys()]) {
    if (!selected.has(k)) this.map.delete(k);
  }
  const used = new Set(this.map.values());
  for (const k of [...selected].sort(this.first || ((a, b) => a - b))) {
    if (this.map.has(k)) continue;
    // Unbounded: past SLOTS the colours come round again, paired with a
    // different dash so no two selections look alike.  Lowest free slot, so
    // the survivors of a deselection keep what they had.
    let i = 0;
    while (used.has(i)) i++;
    this.map.set(k, i);
    used.add(i);
  }
};
Slots.prototype.colour = function (k) {
  return this.map.has(k)
    ? "var(--s" + (this.map.get(k) % SLOTS + 1) + ")" : null;
};

// Dash patterns for each turn round the palette.  Identity is never colour
// alone once the palette repeats: it is the pair, which is why these have to
// be as distinguishable from each other as the hues are.  Nothing beyond the
// last pattern, so a fifth turn would repeat outright -- 40 lines on one
// chart is a problem no encoding solves.
const DASHES = [null, "7 4", "2 3", "11 3 2 3"];

Slots.prototype.dash = function (k) {
  if (!this.map.has(k)) return null;
  return DASHES[Math.floor(this.map.get(k) / SLOTS) % DASHES.length];
};

/** A CSS background for a chip or legend key: the hue, dashed if it repeats. */
Slots.prototype.swatch = function (k) {
  const colour = this.colour(k);
  if (!colour || !this.dash(k)) return colour;
  return "repeating-linear-gradient(90deg, " + colour + " 0 3px, " +
         "transparent 3px 5px)";
};

Slots.prototype.drawable = function (selected) {
  return [...selected].sort((a, b) => a - b).filter(k => this.map.has(k));
};

// Newest series first, so if anything has to go dashed it is the oldest --
// a frozen ESM series rather than the development one.
const seriesSlots = new Slots((a, b) => b - a);
const archSlots = new Slots();
// Pocket and component are filters on every other tab.  On Package lists they
// are also drawn as lines, because an index file belongs to exactly one of
// each -- so they get slots of their own.  Both are well inside SLOTS, so
// nothing is ever dropped for want of a colour.
const pocketSlots = new Slots();
const compSlots = new Slots();
// Suite -- a series and a pocket together, the thing a sources.list line names
// and a Release file describes.  An index file belongs to exactly one, so it
// splits as cleanly as pocket and component do.  The two are packed into one
// number because splitLines() wants a flat key.
const suiteSlots = new Slots();
const NPOCK = DATA.pockets.length;
const RELEASE_POCKET = DATA.pockets.indexOf("release");
const SUITE_NAMES = [];
for (let ser = 0; ser < D.series.length; ser++) {
  for (let po = 0; po < NPOCK; po++) {
    SUITE_NAMES[ser * NPOCK + po] = D.series[ser] +
      (po === RELEASE_POCKET ? "" : "-" + DATA.pockets[po]);
  }
}
// Only the suites the archive actually publishes.  Every series crossed with
// every pocket would offer combinations that have never existed, and an empty
// line still costs one of the few colours.
const SUITES_PRESENT = (function () {
  const seen = new Set(), rows = DATA.byIndex.rows;
  for (let i = 0; i < rows.length; i += 9) {
    seen.add(rows[i + 1] * NPOCK + rows[i + 4]);
  }
  return seen;
})();

function suiteSel() {
  const out = new Set();
  for (const ser of state.series) {
    for (const po of state.pocket) {
      const k = ser * NPOCK + po;
      if (SUITES_PRESENT.has(k)) out.add(k);
    }
  }
  return out;
}
const seriesColour = k => seriesSlots.colour(k);
const archColour = k => archSlots.colour(k);
const seriesSwatch = k => seriesSlots.swatch(k);
const archSwatch = k => archSlots.swatch(k);

function assignSlots() {
  seriesSlots.assign(state.series);
  archSlots.assign(state.arch);
  pocketSlots.assign(state.pocket);
  compSlots.assign(state.comp);
  suiteSlots.assign(suiteSel());
}

/** Whichever dimension the charts are currently drawing one line per. */
function split() {
  return state.splitBy === "arch"
    ? { key: "arch", names: D.arches, sel: state.arch, slots: archSlots,
        label: "architecture" }
    : { key: "series", names: D.series, sel: state.series, slots: seriesSlots,
        label: "series" };
}

/* ------------------------------------------------------------------ state */

// The series a mirror still has to carry, which is what the page opens with.
//
// This is not a question the snapshot data can answer.  The snapshot service
// keeps EOL suites served forever, frozen at whatever they held on their last
// day, so kinetic is just as present in 2026 as noble is -- every candidate
// series answers 200 at the latest snapshot.  The build asks the live archive
// instead and records the answer in DATA.mirrored.
//
// Note that "still carried" is deliberately wider than "still being published
// to": a series goes EOL, stops changing, and is only removed from the
// archive some months later, and in that gap it is costing mirror bytes
// without moving.  Those are exactly the ones a size-based test would miss in
// the other direction too -- the ESM series publish without changing their
// total measurably, so they look frozen and are not.
function activeSeries() {
  if (DATA.mirrored && DATA.mirrored.length) {
    const want = new Set(DATA.mirrored);
    const picked = new Set();
    D.series.forEach((name, i) => { if (want.has(name)) picked.add(i); });
    if (picked.size) return picked;
  }
  return guessedActiveSeries();
}

// The fallback for a dataset built without a mirror probe: a series that has
// not changed size since the snapshot before is taken for a fossil.
function guessedActiveSeries() {
  const last = D.snapshots.length - 1;
  const rows = DATA.byClass.rows;
  const now = new Array(D.series.length).fill(0);
  const before = new Array(D.series.length).fill(0);
  for (let i = 0; i < rows.length; i += 9) {
    const bucket = rows[i] === last ? now : (rows[i] === last - 1 ? before : null);
    if (!bucket) continue;
    const mask = rows[i + 1], size = rows[i + 7];
    for (let ser = 0; ser < D.series.length; ser++) {
      if (mask >> ser & 1) bucket[ser] += size;
    }
  }
  const active = [];
  for (let ser = 0; ser < D.series.length; ser++) {
    if (now[ser] && now[ser] !== before[ser]) active.push(ser);
  }
  const candidates = active.length
    ? active
    : now.map((v, i) => (v ? i : -1)).filter(i => i >= 0);
  const picked = new Set(candidates);
  return picked.size ? picked : new Set(D.series.map((_, i) => i));
}

// What the page opens with, and what Reset puts back.  Kept as its own object
// rather than only as the starting state, so "select default" on the series
// row has something to point at after you have clicked around.
const DEFAULTS = {
  series: activeSeries(),
  arch: new Set(D.arches.map((_, i) => i)),
  pocket: new Set(DATA.pockets.map((_, i) => i)),
  comp: new Set(D.components.map((_, i) => i)),
  metric: "size",
  splitBy: "series",
  shown: "total",
  rateWindow: 3,
  snap: D.snapshots.length - 1,
  filters: true,
  view: "archive",
};

/** Refill a selection in place; the chip handlers close over the Set itself. */
function setTo(target, source) {
  target.clear();
  for (const v of source) target.add(v);
}

const state = {
  series: new Set(DEFAULTS.series),
  arch: new Set(DEFAULTS.arch),
  pocket: new Set(DEFAULTS.pocket),
  comp: new Set(DEFAULTS.comp),
  metric: DEFAULTS.metric,
  splitBy: DEFAULTS.splitBy,
  shown: DEFAULTS.shown,
  rateWindow: DEFAULTS.rateWindow,
  view: DEFAULTS.view,
  snap: DEFAULTS.snap,
  zoom: null,
  filters: DEFAULTS.filters,
};

/* ----------------------------------------------------------- shareable URL */

// State goes in the location hash, not a query string, because a page opened
// over file:// has to carry it too.  Only what differs from the defaults is
// written, so an untouched page keeps a clean URL and a shared link reads as
// a list of what the sender actually changed.
//
// Names and snapshot stamps rather than indices, deliberately: a link should
// still mean the same thing after the next rebuild, which appends snapshots
// and may add a series, and an index would quietly come to mean its
// neighbour.  Anything unrecognised is ignored rather than fatal, so an old
// link degrades to the default instead of a blank page.

let zoomFound = false;

function setNames(sel, names) {
  return [...sel].sort((a, b) => a - b).map(i => names[i]).join(",");
}

function namesToSet(text, names) {
  const out = new Set();
  for (const n of text.split(",")) {
    const i = names.indexOf(n);
    if (i >= 0) out.add(i);
  }
  return out;
}

function sameSet(a, b) {
  if (a.size !== b.size) return false;
  for (const v of a) if (!b.has(v)) return false;
  return true;
}

function encodeState() {
  const out = [];
  const set = (k, v) => out.push(k + "=" + v);
  if (state.view !== DEFAULTS.view) set("v", state.view);
  if (!sameSet(state.series, DEFAULTS.series))
    set("s", setNames(state.series, D.series));
  if (!sameSet(state.arch, DEFAULTS.arch))
    set("a", setNames(state.arch, D.arches));
  if (!sameSet(state.pocket, DEFAULTS.pocket))
    set("p", setNames(state.pocket, DATA.pockets));
  if (!sameSet(state.comp, DEFAULTS.comp))
    set("c", setNames(state.comp, D.components));
  if (state.metric !== DEFAULTS.metric) set("m", state.metric);
  if (state.splitBy !== DEFAULTS.splitBy) set("l", state.splitBy);
  if (state.shown !== DEFAULTS.shown) set("d", state.shown);
  if (state.rateWindow !== DEFAULTS.rateWindow) set("w", state.rateWindow);
  if (state.snap !== DEFAULTS.snap) set("n", D.snapshots[state.snap]);
  if (state.zoom) set("z", state.zoom);
  if (!state.filters) set("f", "0");
  return out.join("&");
}

/** Put the hash into state.  Absent keys mean the default, so the caller
    resets first and this only overrides. */
function applyHash(hash) {
  const text = String(hash || "").replace(/^#/, "");
  if (!text) return;
  const got = new Map();
  for (const part of text.split("&")) {
    const i = part.indexOf("=");
    if (i <= 0) continue;
    // A stray % is a link mangled in transit, and decodeURIComponent throws
    // on it; drop that one key rather than the page.
    try {
      got.set(part.slice(0, i), decodeURIComponent(part.slice(i + 1)));
    } catch (e) {
      continue;
    }
  }
  const views = ["archive", "time", "breakdown", "table", "lists"];
  if (views.includes(got.get("v"))) state.view = got.get("v");
  if (got.has("s")) setTo(state.series, namesToSet(got.get("s"), D.series));
  if (got.has("a")) setTo(state.arch, namesToSet(got.get("a"), D.arches));
  if (got.has("p")) setTo(state.pocket, namesToSet(got.get("p"), DATA.pockets));
  if (got.has("c")) setTo(state.comp, namesToSet(got.get("c"), D.components));
  if (["size", "isize"].includes(got.get("m"))) state.metric = got.get("m");
  if (["series", "arch"].includes(got.get("l"))) state.splitBy = got.get("l");
  if (["total", "log", "rate"].includes(got.get("d"))) state.shown = got.get("d");
  if (got.has("w")) {
    const w = Number(got.get("w"));
    if ([1, 3, 6].includes(w)) state.rateWindow = w;
  }
  if (got.has("n")) {
    const i = D.snapshots.indexOf(got.get("n"));
    if (i >= 0) state.snap = i;
  }
  if (got.has("z")) state.zoom = got.get("z");
  if (got.has("f")) state.filters = got.get("f") !== "0";
}

/** Reflect state in the address bar.
 *
 *  replaceState keeps a click out of the back history, but some browsers
 *  refuse it on a file:// document, so fall back to assigning the hash --
 *  which works there, at the cost of a history entry per change.
 */
function syncHash() {
  const text = encodeState();
  try {
    history.replaceState(null, "", text ? "#" + text : location.pathname);
  } catch (e) {
    if (location.hash.replace(/^#/, "") !== text) location.hash = text;
  }
}

/** Every filter and control back to what the page opened with.
 *
 *  Which tab you are on is navigation rather than a filter, so it is left
 *  where it is -- and for the same reason so are the focused chart and
 *  whether the filter rows are folded.  Those three have DEFAULTS entries all
 *  the same, because that is where the page's opening state is written down;
 *  they are just not what Reset is for.
 */
function resetDefaults() {
  setTo(state.series, DEFAULTS.series);
  setTo(state.arch, DEFAULTS.arch);
  setTo(state.pocket, DEFAULTS.pocket);
  setTo(state.comp, DEFAULTS.comp);
  state.metric = DEFAULTS.metric;
  state.splitBy = DEFAULTS.splitBy;
  state.shown = DEFAULTS.shown;
  state.rateWindow = DEFAULTS.rateWindow;
  state.snap = DEFAULTS.snap;
}

/* -------------------------------------------------------------- formatting */

function bytes(n) {
  const units = ["B", "KiB", "MiB", "GiB", "TiB", "PiB"];
  let u = 0;
  while (Math.abs(n) >= 1024 && u < units.length - 1) { n /= 1024; u++; }
  // Magnitude decides the precision, so that a negative change is written to
  // the same number of places as the positive one above it on the axis.
  return (Math.abs(n) >= 100 || u === 0 ? n.toFixed(0) : n.toFixed(1)) +
         " " + units[u];
}
function pct(n) { return (n * 100).toFixed(1) + "%"; }
// Some of these are genuinely tiny -- the package lists are 0.016% of the
// archive they describe, which pct() would round away to 0.0%.
function pctFine(n) {
  const v = n * 100;
  return (v >= 1 ? v.toFixed(1) : v >= 0.1 ? v.toFixed(2) : v.toFixed(3)) + "%";
}
function count(n) { return n.toLocaleString(); }
/** A change needs its sign spelled out, including the one a formatter would
    not print: "+1.4 GiB" reads as a movement where "1.4 GiB" reads as a size. */
function signed(v, fmt) { return (v > 0 ? "+" : "") + fmt(v); }
function stamp(s) { return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8); }
function snapDate(s) { return new Date(stamp(s) + "T00:00:00Z"); }
function shortStamp(s) { return s.slice(0, 4) + "-" + s.slice(4, 6); }
/** Days between the last two snapshots, so the change view can say what one
    interval actually is.  "Per snapshot" means nothing on its own, and the
    same page gets built at monthly and at weekly resolution. */
function snapSpacing() {
  const s = D.snapshots;
  if (s.length < 2) return 0;
  const utc = x => Date.UTC(+x.slice(0, 4), +x.slice(4, 6) - 1, +x.slice(6, 8));
  return Math.round((utc(s[s.length - 1]) - utc(s[s.length - 2])) / 86400000);
}

/* -------------------------------------------------------------- scanning */

function pocketMask() {
  let m = 0;
  for (const p of state.pocket) m |= 1 << p;
  return m;
}
const metricIdx = () => (state.metric === "size" ? 7 : 8);

// A row's mask is every pocket the file appears in; it is included when the
// selection touches any of them, and counted once. That is exactly the union
// of the selected pockets, which is what the archive holds on disk.
function seriesMask() {
  let m = 0;
  for (const s of state.series) m |= 1 << s;
  return m;
}

// Both masks work the same way: a row carries every pocket, and every series,
// that references its file, and is included -- once -- when the selection
// touches any of them.  That is the union of what you ticked, which is what
// the archive holds on disk, rather than the sum of the indexes.
function scanClass(fn) {
  const rows = DATA.byClass.rows, pm = pocketMask(), sm = seriesMask();
  const vi = metricIdx();
  for (let i = 0; i < rows.length; i += 9) {
    if (!(rows[i + 4] & pm)) continue;
    if (!(rows[i + 1] & sm)) continue;
    if (!state.arch.has(rows[i + 2])) continue;
    if (!state.comp.has(rows[i + 3])) continue;
    fn(rows[i], rows[i + 1], rows[i + 2], rows[i + 5], rows[i + 6], rows[i + vi]);
  }
}

function scanFlavour(fn) {
  const rows = DATA.byFlavour.rows, pm = pocketMask(), sm = seriesMask();
  const vi = metricIdx();   // byClass's columns, flavour where class goes
  for (let i = 0; i < rows.length; i += 9) {
    if (!(rows[i + 4] & pm)) continue;
    if (!(rows[i + 1] & sm)) continue;
    if (!state.arch.has(rows[i + 2])) continue;
    if (!state.comp.has(rows[i + 3])) continue;
    fn(rows[i], rows[i + 1], rows[i + 2], rows[i + 5], rows[i + 6], rows[i + vi]);
  }
}

// byIndex is one row per index file: snapshot, series, arch, component,
// pocket, entries, kernel entries, compressed bytes, uncompressed bytes.
// Alone among the tables here it is not deduplicated, because what it measures
// is the lists rather than the pool they point at: the archive really does
// publish a separate Packages for every series, pocket, component and
// architecture, and an Architecture: all package really is a stanza in each of
// them.  Pocket is a plain index rather than a mask for the same reason -- an
// index file belongs to exactly one suite.
function scanIndex(fn) {
  const rows = DATA.byIndex.rows;
  for (let i = 0; i < rows.length; i += 9) {
    if (!state.series.has(rows[i + 1])) continue;
    if (!state.arch.has(rows[i + 2])) continue;
    if (!state.comp.has(rows[i + 3])) continue;
    if (!state.pocket.has(rows[i + 4])) continue;
    fn(rows[i], rows[i + 1], rows[i + 2], rows[i + 3], rows[i + 4],
       rows[i + 5], rows[i + 6], rows[i + 7], rows[i + 8]);
  }
}

/** timeline(), but over index files; same shape, so splitLines() fits it.

    Takes the dimension to split on rather than reading the "one line per"
    control, because this tab draws pocket and component as lines too, and an
    index file has exactly one of each -- so any of the four is a clean split
    with no double counting.
 */
function indexTimelineBy(sp, keyOf) {
  const perKey = new Map();
  const blank = () => ({ files: 0, n: 0, kn: 0, csize: 0, usize: 0 });
  const totals = D.snapshots.map(blank);

  function add(key, snap, n, kn, c, u) {
    let per = perKey.get(key);
    if (!per) { per = D.snapshots.map(() => null); perKey.set(key, per); }
    let cell = per[snap];
    if (!cell) cell = per[snap] = blank();
    cell.files++; cell.n += n; cell.kn += kn; cell.csize += c; cell.usize += u;
  }

  scanIndex((snap, ser, arch, comp, pocket, n, kn, c, u) => {
    const t = totals[snap];
    t.files++; t.n += n; t.kn += kn; t.csize += c; t.usize += u;
    add(keyOf(ser, arch, comp, pocket), snap, n, kn, c, u);
  });
  return { perKey, totals, split: sp };
}

function indexTimeline() {
  const sp = split();
  return indexTimelineBy(
    sp, (ser, arch) => (sp.key === "arch" ? arch : ser));
}

/** The two splits this tab adds, as the shape splitLines() expects. */
function pocketSplit() {
  return { key: "pocket", names: DATA.pockets, sel: state.pocket,
           slots: pocketSlots, label: "pocket" };
}
function componentSplit() {
  return { key: "component", names: D.components, sel: state.comp,
           slots: compSlots, label: "component" };
}
function suiteSplit() {
  return { key: "suite", names: SUITE_NAMES, sel: suiteSel(),
           slots: suiteSlots, label: "suite" };
}

/** kernel/total bytes at one snapshot, deduplicated across the selection. */
function snapshotTotals(snap) {
  const cur = { kernel: 0, total: 0, n: 0, kn: 0 };
  scanClass((s, smask, arch, cls, n, v) => {
    if (s !== snap) return;
    cur.total += v;
    cur.n += n;
    if (cls !== OTHER) { cur.kernel += v; cur.kn += n; }
  });
  return cur;
}

/** Per-snapshot totals, plus a per-key breakdown along the split dimension.

    The totals count each file once however many series or architectures share
    it.  The per-key numbers deliberately do not: a file both jammy and noble
    reference is part of jammy's size and part of noble's, so it is added to
    each.  That is why the lines do not sum to the total, and why the archive
    view reads the totals rather than adding the lines up.
 */
function timeline() {
  const sp = split();
  const perKey = new Map();
  const totals = D.snapshots.map(() => ({ kernel: 0, total: 0, n: 0, kn: 0 }));

  function add(key, snap, cls, n, v) {
    let per = perKey.get(key);
    if (!per) { per = D.snapshots.map(() => null); perKey.set(key, per); }
    let cell = per[snap];
    if (!cell) cell = per[snap] = { kernel: 0, total: 0, n: 0, kn: 0 };
    cell.total += v;
    cell.n += n;
    if (cls !== OTHER) { cell.kernel += v; cell.kn += n; }
  }

  scanClass((snap, smask, arch, cls, n, v) => {
    const t = totals[snap];
    t.total += v;
    t.n += n;
    if (cls !== OTHER) { t.kernel += v; t.kn += n; }
    if (sp.key === "arch") {
      add(arch, snap, cls, n, v);
    } else {
      for (const ser of state.series) {
        if (smask >> ser & 1) add(ser, snap, cls, n, v);
      }
    }
  });
  return { perKey, totals, split: sp };
}

/* ---------------------------------------------------------------- svg bits */

const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}

/** Bar anchored at the baseline with only its data end rounded. */
function barPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w));
  return "M" + x + "," + y +
         "h" + (w - r) + "a" + r + "," + r + " 0 0 1 " + r + "," + r +
         "v" + (h - 2 * r) + "a" + r + "," + r + " 0 0 1 " + (-r) + "," + r +
         "h" + (r - w) + "z";
}

/** Nice round tick values from 0 up to at least max.

    The top tick has to sit at or above max, not below it: the chart scales the
    plot to the last tick, so a top tick under the data draws the line off the
    top of the axes.  Ticks are built by multiplying rather than accumulating,
    so 0.1-sized steps do not drift.
 */
function ticks(max, want) {
  if (!(max > 0)) return [0, 1];
  const raw = max / want;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const n = Math.ceil(max / step - 1e-9);
  const out = [];
  for (let i = 0; i <= n; i++) out.push(i * step);
  return out;
}

/** Nice round ticks covering a range that may straddle zero.

    Same idea of a nice step as ticks(), but the ladder is built from multiples
    of that step instead of counting up from zero, so a range that crosses zero
    always lands a tick exactly on it -- which is the line the change view gets
    read against.
 */
function spanTicks(lo, hi, want) {
  if (!(hi > lo)) { lo = Math.min(0, lo) - 1; hi = Math.max(0, hi) + 1; }
  const raw = (hi - lo) / want;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let i = Math.floor(lo / step + 1e-9); i <= Math.ceil(hi / step - 1e-9); i++) {
    out.push(i * step);
  }
  return out;
}

/** Gridline values for a log axis running from lo to hi.

    These are labels only -- the axis runs from the data, and these are the
    round numbers that fall inside it.  That is the opposite of ticks(), which
    rounds the axis outwards to its top tick, and it is deliberate: the whole
    archive spans 1.8 to 7.1 TiB, and rounding that out to a clean 1 .. 10 TiB
    would spend two thirds of the plot on empty space.

    A log axis here covers anything from half a decade to six (a per-series
    chart has bionic frozen in megabytes while jammy moves in terabytes), so
    1-2-5 is thinned to decades and then to every other decade rather than
    coarsened, which keeps whatever survives a round number.  Being labels
    rather than the domain, dropping one can no longer push the data off the
    top of the plot.
 */
function logTicks(lo, hi) {
  // 1-2-5 leaves a range narrower than about a decade with one or two labels
  // on it, which is not an axis.  Over a short span the gaps between round
  // numbers are small enough to use all of them.
  const mults = Math.log10(hi / lo) < 1.2
    ? [1, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8, 9] : [1, 2, 5];
  const out = [];
  for (let k = Math.floor(Math.log10(lo)); k <= Math.ceil(Math.log10(hi)); k++) {
    for (const m of mults) {
      const v = m * Math.pow(10, k);
      if (v >= lo && v <= hi) out.push(v);
    }
  }
  out.sort((a, b) => a - b);
  const decade = v => Math.abs(Math.log10(v) - Math.round(Math.log10(v))) < 1e-9;
  let thin = out;
  if (thin.length > 8) {
    // Decades first, but only if there are enough of them to be an axis: a
    // span under a decade contains one at most, and thinning to that single
    // label would leave the chart with nothing to read values against.
    const dec = thin.filter(decade);
    thin = dec.length >= 3 ? dec : thin;
    while (thin.length > 8) thin = thin.filter((_, n) => n % 2 === 0);
  }
  // A range too narrow to contain two round numbers gets its own ends instead.
  return thin.length >= 2 ? thin : [lo, hi];
}

/** Midnight UTC of a snapshot stamp, as a millisecond value. */
function snapDay(s) {
  return Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
}

/** How many snapshots back a window of `months` reaches. */
function windowSnapshots(months) {
  return Math.max(1, Math.round(months * 30.4375 / (snapSpacing() || 30.4375)));
}

/** The trailing rate of change, in units per 30-day month.

    A single interval is mostly noise -- a quarter of the weekly page's
    consecutive differences flip sign -- and one archive-wide removal is forty
    times the median week, so it sets the axis and flattens everything else
    into the zero line.  Measuring across a window fixes both at once: it
    averages the noise out, and it spreads a one-off event over the window
    instead of letting it spike.

    Per month rather than per snapshot, so that the monthly and the weekly
    build of this page read off the same axis.  The divisor is the real
    elapsed time, not the window's nominal length, because monthly snapshots
    are not all the same number of days.
 */
function rates(points, months) {
  const back = windowSnapshots(months);
  return points.map((v, i) => {
    const prev = i >= back ? points[i - back] : null;
    if (v === null || prev === null) return null;
    const span = (snapDay(D.snapshots[i]) - snapDay(D.snapshots[i - back]))
                 / (30.4375 * 86400000);
    return span > 0 ? (v - prev) / span : null;
  });
}

const tooltip = document.getElementById("tooltip");
function showTip(html, x, y) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = "1";
  const box = tooltip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + box.width > window.innerWidth - 8) left = x - box.width - 14;
  if (top + box.height > window.innerHeight - 8) top = y - box.height - 14;
  tooltip.style.left = Math.max(8, left) + "px";
  tooltip.style.top = Math.max(8, top) + "px";
}
function hideTip() { tooltip.style.opacity = "0"; }

/* -------------------------------------------------------------- line chart */

function lineChart(host, opts) {
  const width = Math.max(560, host.clientWidth || 900);
  const height = Math.round((opts.height || 300) * (state.zoom ? 1.9 : 1));
  const pad = { top: 12, right: 96, bottom: 30, left: 62 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  // What the toggle does lives here rather than at the fourteen call sites, so
  // one control reaches every line chart on the page.
  const rate = state.shown === "rate";
  const logY = state.shown === "log";
  const series = rate
    ? opts.series.map(s => ({ name: s.name, colour: s.colour, dash: s.dash,
                              points: rates(s.points, state.rateWindow) }))
    : logY
    // Zero and below have no position on a log axis.  A gap says "cannot be
    // drawn here", which is the truth, where clamping to the bottom tick would
    // invent a value and draw a line to it.
    ? opts.series.map(s => ({ name: s.name, colour: s.colour, dash: s.dash,
                              points: s.points.map(p => (p > 0 ? p : null)) }))
    : opts.series;
  const fmt = rate ? (v => signed(v, opts.diffFmt || opts.fmt) + "/mo")
            : logY ? (opts.logFmt || opts.fmt) : opts.fmt;

  const svg = el("svg", { width, height, viewBox: "0 0 " + width + " " + height,
                          role: "img",
                          "aria-label": (opts.title || "chart") +
                            (rate ? ", rate of change" : "") +
                            (logY ? ", logarithmic scale" : "") });

  const xs = opts.x;
  const vals = series.flatMap(s => s.points.filter(p => p !== null));
  let yTicks, Y;
  if (logY) {
    // The domain is the data: every positive point is inside the plot by
    // construction, however the labels end up being thinned.
    const hiV = vals.length ? Math.max(...vals) : 1;
    const loV = vals.length ? Math.min(...vals) : hiV / 10;
    const l0 = Math.log10(loV === hiV ? loV / 10 : loV);
    const l1 = Math.log10(hiV);
    yTicks = logTicks(Math.pow(10, l0), hiV);
    Y = v => pad.top + plotH - plotH * ((Math.log10(v) - l0) / ((l1 - l0) || 1));
  } else if (rate) {
    // Zero stays in range: a rate chart is unreadable without the line it is
    // measured against.  minMax is a floor for totals only -- it stops a flat
    // share chart filling the plot with noise, and a rate chart has its own
    // floor in the zero line.
    yTicks = spanTicks(Math.min(0, ...vals), Math.max(0, ...vals), 5);
    const lo = yTicks[0];
    const top = yTicks[yTicks.length - 1] || 1;
    Y = v => pad.top + plotH - plotH * ((v - lo) / ((top - lo) || 1));
  } else {
    yTicks = ticks(Math.max(opts.minMax || 0, 0, ...vals), 5);
    const top = yTicks[yTicks.length - 1] || 1;
    Y = v => pad.top + plotH - plotH * (v / top);
  }
  const X = i => pad.left + (xs.length === 1 ? plotW / 2 : plotW * i / (xs.length - 1));

  for (const t of yTicks) {
    el("line", { x1: pad.left, x2: pad.left + plotW, y1: Y(t), y2: Y(t),
                 stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const label = el("text", { x: pad.left - 8, y: Y(t) + 4, "text-anchor": "end" }, svg);
    label.textContent = fmt(t);
  }
  // x labels: thin them out so they never collide
  const every = Math.max(1, Math.ceil(xs.length / (plotW / 62)));
  xs.forEach((label, i) => {
    if (i % every && i !== xs.length - 1) return;
    const t = el("text", { x: X(i), y: height - 10, "text-anchor": "middle" }, svg);
    t.textContent = label;
  });
  const base = logY ? yTicks[0] : 0;
  el("line", { x1: pad.left, x2: pad.left + plotW, y1: Y(base), y2: Y(base),
               stroke: "var(--axis)", "stroke-width": 1 }, svg);

  for (const s of series) {
    let d = "", pen = false;
    s.points.forEach((v, i) => {
      if (v === null) { pen = false; return; }
      d += (pen ? "L" : "M") + X(i) + "," + Y(v);
      pen = true;
    });
    if (!d) continue;
    el("path", { d, fill: "none", stroke: s.colour, "stroke-width": 2,
                 ...(s.dash ? { "stroke-dasharray": s.dash } : {}),
                 "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    // direct label at the last real point
    let last = -1;
    s.points.forEach((v, i) => { if (v !== null) last = i; });
    if (last >= 0) {
      el("circle", { cx: X(last), cy: Y(s.points[last]), r: 3.5, fill: s.colour,
                     stroke: "var(--surface)", "stroke-width": 2 }, svg);
      const t = el("text", { x: X(last) + 9, y: Y(s.points[last]) + 4,
                             class: "endlabel", fill: s.colour }, svg);
      t.textContent = s.name;
    }
  }

  // crosshair + tooltip
  const hair = el("line", { y1: pad.top, y2: pad.top + plotH, stroke: "var(--axis)",
                            "stroke-width": 1, opacity: 0 }, svg);
  const hit = el("rect", { x: pad.left, y: pad.top, width: plotW, height: plotH,
                           fill: "transparent" }, svg);
  hit.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const rel = (ev.clientX - box.left - pad.left) / (plotW || 1);
    const i = Math.max(0, Math.min(xs.length - 1, Math.round(rel * (xs.length - 1))));
    hair.setAttribute("x1", X(i));
    hair.setAttribute("x2", X(i));
    hair.setAttribute("opacity", 1);
    let html = '<div class="tt-title">' + opts.xTitle(i) + "</div>";
    for (const s of series) {
      if (s.points[i] === null) continue;
      html += '<div class="tt-row"><span style="color:' + s.colour + '">●</span>' +
              "<span>" + s.name + "</span><span>" + fmt(s.points[i]) + "</span></div>";
    }
    showTip(html, ev.clientX, ev.clientY);
  });
  hit.addEventListener("mouseleave", () => { hair.setAttribute("opacity", 0); hideTip(); });

  host.innerHTML = "";
  host.appendChild(svg);
}

/* --------------------------------------------------------------- bar chart */

function barChart(host, opts) {
  const items = opts.items;
  if (!items.length) { host.innerHTML = '<div class="empty">Nothing selected.</div>'; return; }
  const width = Math.max(520, host.clientWidth || 900);
  const rowH = state.zoom ? 34 : 26, gap = 2;
  const pad = { top: 8, right: 120, bottom: 24, left: opts.labelWidth || 150 };
  const height = pad.top + items.length * rowH + pad.bottom;
  const plotW = width - pad.left - pad.right;
  const svg = el("svg", { width, height, viewBox: "0 0 " + width + " " + height,
                          role: "img", "aria-label": opts.title || "chart" });
  const max = Math.max(...items.map(d => Math.max(d.value, d.total || 0)));
  const scale = v => (max > 0 ? plotW * v / max : 0);

  items.forEach((d, i) => {
    const y = pad.top + i * rowH;
    const h = rowH - gap * 2;
    const label = el("text", { x: pad.left - 10, y: y + h / 2 + 4,
                               "text-anchor": "end", class: "axislabel" }, svg);
    label.textContent = d.label;
    if (d.total !== undefined) {
      el("path", { d: barPath(pad.left, y + gap, Math.max(scale(d.total), 1), h, 4),
                   fill: "var(--neutral-fill)" }, svg);
    }
    el("path", { d: barPath(pad.left, y + gap, Math.max(scale(d.value), 1), h, 4),
                 fill: d.colour || "var(--s1)" }, svg);
    const t = el("text", { x: pad.left + Math.max(scale(d.total ?? d.value), 1) + 10,
                           y: y + h / 2 + 4, class: "axislabel" }, svg);
    t.textContent = opts.rowLabel(d);

    const hit = el("rect", { x: pad.left, y, width: plotW, height: rowH,
                             fill: "transparent" }, svg);
    hit.addEventListener("mousemove", ev => showTip(opts.tip(d), ev.clientX, ev.clientY));
    hit.addEventListener("mouseleave", hideTip);
  });

  host.innerHTML = "";
  host.appendChild(svg);
}

/* ----------------------------------------------------------------- filters */

function chipRow(label, values, selected, onToggle, colourFor, extras) {
  const row = document.createElement("div");
  row.className = "frow";
  const name = document.createElement("div");
  name.className = "flabel";
  name.textContent = label;
  row.appendChild(name);
  const chips = document.createElement("div");
  chips.className = "chips";
  values.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "chip p-chip is-dense";
    b.type = "button";
    b.setAttribute("aria-pressed", selected.has(i) ? "true" : "false");
    if (colourFor) {
      const sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = colourFor(i) || "var(--muted)";
      b.appendChild(sw);
    }
    b.appendChild(document.createTextNode(v));
    b.addEventListener("click", () => { onToggle(i); render(); });
    chips.appendChild(b);
  });
  const all = document.createElement("button");
  all.className = "chip p-chip is-dense allnone";
  all.type = "button";
  // "select all"/"select none" rather than "all"/"none": one of the values in
  // the architecture row is itself called "all".
  all.textContent = selected.size === values.length ? "select none" : "select all";
  all.addEventListener("click", () => {
    if (selected.size === values.length) selected.clear();
    else values.forEach((_, i) => selected.add(i));
    render();
  });
  chips.appendChild(all);
  for (const extra of extras || []) {
    const b = document.createElement("button");
    b.className = "chip p-chip is-dense allnone";
    b.type = "button";
    b.textContent = extra[0];
    b.title = extra[1];
    b.addEventListener("click", () => { extra[2](); render(); });
    chips.appendChild(b);
  }
  row.appendChild(chips);
  return row;
}

function toggler(set) {
  return i => { if (set.has(i)) set.delete(i); else set.add(i); };
}

/** A row of mutually exclusive chips bound to one field of state. */
function pickRow(label, choices, field) {
  const row = document.createElement("div");
  row.className = "frow";
  const lab = document.createElement("div");
  lab.className = "flabel";
  lab.textContent = label;
  row.appendChild(lab);
  const chips = document.createElement("div");
  chips.className = "chips";
  for (const choice of choices) {
    const b = document.createElement("button");
    b.className = "chip p-chip is-dense";
    b.type = "button";
    b.textContent = choice[1];
    if (choice[2]) b.title = choice[2];
    b.setAttribute("aria-pressed", state[field] === choice[0] ? "true" : "false");
    b.addEventListener("click", () => { state[field] = choice[0]; render(); });
    chips.appendChild(b);
  }
  row.appendChild(chips);
  return row;
}

/** One line describing the filters, for when the rows are folded away.
 *
 *  Worth the space: a folded filter row would otherwise leave every chart
 *  below it unexplained, and "6 of 10 architectures" is exactly the sort of
 *  thing you forget you set.
 */
function filterSummary() {
  const dim = (sel, names, label) =>
    (sel.size === names.length ? "all " + names.length
                               : sel.size + " of " + names.length) + " " + label;
  const bits = [
    dim(state.series, D.series, "series"),
    dim(state.arch, D.arches, "architectures"),
    dim(state.pocket, DATA.pockets, "pockets"),
    dim(state.comp, D.components, "components"),
  ];
  if (state.metric !== DEFAULTS.metric) bits.push("installed size");
  if (state.splitBy !== DEFAULTS.splitBy) bits.push("a line per architecture");
  if (state.shown === "log") bits.push("log scale");
  if (state.shown === "rate") {
    bits.push("rate over " + state.rateWindow +
              (state.rateWindow === 1 ? " month" : " months"));
  }
  return bits.join(" \u00b7 ");
}

function buildFilters() {
  const host = document.getElementById("filters");
  host.innerHTML = "";
  const btn = document.getElementById("filterbtn");
  btn.textContent = state.filters ? "Hide filters" : "Show filters";
  btn.setAttribute("aria-expanded", state.filters ? "true" : "false");
  if (!state.filters) {
    const row = document.createElement("div");
    row.className = "frow";
    const name = document.createElement("div");
    name.className = "flabel";
    name.textContent = "Filters";
    row.appendChild(name);
    const b = document.createElement("button");
    b.className = "p-button--base is-dense summary";
    b.type = "button";
    b.textContent = filterSummary();
    b.title = "bring the filters back";
    b.addEventListener("click", () => { state.filters = true; render(); });
    row.appendChild(b);
    host.appendChild(row);
    return;
  }
  host.appendChild(chipRow("Series", D.series, state.series, toggler(state.series),
                           i => seriesSwatch(i),
                           [["select default",
                             "every series the live archive still carries, " +
                             "which is what the page opens with",
                             () => setTo(state.series, DEFAULTS.series)]]));
  host.appendChild(chipRow("Arch", D.arches, state.arch, toggler(state.arch),
                           i => archSwatch(i)));
  host.appendChild(chipRow("Pocket", DATA.pockets, state.pocket, toggler(state.pocket)));
  host.appendChild(chipRow("Component", D.components, state.comp, toggler(state.comp)));

  host.appendChild(pickRow("Measure", [["size", "Download size"],
                                       ["isize", "Installed size"]], "metric"));
  host.appendChild(pickRow("One line per", [["series", "Series"],
                                            ["arch", "Architecture"]], "splitBy"));
  host.appendChild(pickRow("Lines show", [
    ["total", "Totals", "the value at each snapshot"],
    ["log", "Totals, log scale",
     "the same values on a logarithmic axis, where a straight line is steady " +
     "percentage growth and the slope is the rate"],
    ["rate", "Rate of change",
     "how fast it is growing, averaged over a trailing window so that one " +
     "unusual snapshot does not set the scale"],
  ], "shown"));
  // Only worth the row when there is a rate to apply it to.
  if (state.shown === "rate") {
    host.appendChild(pickRow("Rate over", [
      [1, "1 month"], [3, "3 months"], [6, "6 months"],
    ], "rateWindow"));
  }
}

/* ------------------------------------------------------------------- views */

/** Build the line series for the current split. */
function splitLines(tl, pick) {
  const sp = tl.split;
  const drawn = sp.slots.drawable(sp.sel);
  return {
    label: sp.label,
    keys: drawn,
    series: drawn.map(k => ({
      name: sp.names[k],
      colour: sp.slots.colour(k),
      dash: sp.slots.dash(k),
      points: (tl.perKey.get(k) || []).map(c => (c ? pick(c) : null)),
    })),
  };
}

function viewTime(host, tl) {
  const xs = D.snapshots.map(shortStamp);
  const shareLines = splitLines(tl, c => (c.total ? 100 * c.kernel / c.total : null));

  const shareCard = card(host, "Kernel share, per " + tl.split.label,
    "Kernel bytes as a percentage of everything selected, one line per " +
    tl.split.label + ", at each snapshot.", "share-by-split");
  lineChart(shareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    diffFmt: v => v.toFixed(1) + " pp",
    logFmt: v => (v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1)
                                                  : v.toFixed(2)) + "%",
    minMax: 10,
    series: shareLines.series,
  });
  legend(shareCard, shareLines.series.map(l => [l.name, l.colour, l.dash]));

  const absLines = splitLines(tl, c => c.kernel);
  const absCard = card(host, "Kernel bytes, per " + tl.split.label,
    "The same selection in absolute terms, so a rising share can be told apart " +
    "from a shrinking archive.", "bytes-by-split");
  lineChart(absCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: absLines.series,
  });
  legend(absCard, absLines.series.map(l => [l.name, l.colour, l.dash]));
}

function viewBreakdown(host) {
  snapshotChooser(host, drawBreakdown);
}

function drawBreakdown(host) {
  const snap = state.snap;
  const byClass = new Map(), byArch = new Map(), byFlav = new Map();
  scanClass((s, smask, arch, cls, n, v) => {
    if (s !== snap) return;
    let a = byArch.get(arch);
    if (!a) byArch.set(arch, a = { kernel: 0, total: 0, n: 0 });
    a.total += v;
    if (cls !== OTHER) {
      a.kernel += v;
      a.n += n;
      const c = byClass.get(cls) || { v: 0, n: 0 };
      c.v += v; c.n += n;
      byClass.set(cls, c);
    }
  });
  scanFlavour((s, smask, arch, flav, n, v) => {
    if (s !== snap) return;
    const f = byFlav.get(flav) || { v: 0, n: 0 };
    f.v += v; f.n += n;
    byFlav.set(flav, f);
  });

  const archCard = card(host, "Kernel share by architecture",
    "Solid bar: kernel packages. Faint bar behind it: everything published for " +
    "that architecture. 'all' and 'source' are rows of their own because the " +
    "archive keeps one copy of each, not one per architecture.", "share-by-arch");
  barChart(archCard, {
    labelWidth: 92,
    items: [...byArch.entries()]
      .sort((a, b) => b[1].total - a[1].total)
      .map(entry => ({
        label: D.arches[entry[0]], value: entry[1].kernel,
        total: entry[1].total, n: entry[1].n,
      })),
    rowLabel: d => pct(d.total ? d.value / d.total : 0) + " of " + bytes(d.total),
    tip: d => '<div class="tt-title">' + d.label + "</div>" +
      '<div class="tt-row"><span>kernel</span><span>' + bytes(d.value) + "</span></div>" +
      '<div class="tt-row"><span>everything</span><span>' + bytes(d.total) + "</span></div>" +
      '<div class="tt-row"><span>share</span><span>' +
      pct(d.total ? d.value / d.total : 0) + "</span></div>" +
      '<div class="tt-row"><span>kernel packages</span><span>' + count(d.n) + "</span></div>",
  });
  legend(archCard, [["kernel packages", "var(--s1)"],
                    ["everything published", "var(--neutral-fill)"]]);

  const clsCard = card(host, "Where the kernel bytes go",
    "Kernel packages by kind. 'objects' is linux-objects-* from " +
    "linux-restricted-modules, the pre-built third-party drivers.", "kernel-bytes-where");
  barChart(clsCard, {
    labelWidth: 130,
    items: [...byClass.entries()].sort((a, b) => b[1].v - a[1].v)
      .map(entry => ({ label: D.classes[entry[0]], value: entry[1].v, n: entry[1].n })),
    rowLabel: d => bytes(d.value),
    tip: d => '<div class="tt-title">' + d.label + "</div>" +
      '<div class="tt-row"><span>size</span><span>' + bytes(d.value) + "</span></div>" +
      '<div class="tt-row"><span>packages</span><span>' + count(d.n) + "</span></div>",
  });

  const flavCard = card(host, "By kernel flavour",
    "Sources collapsed to the kernel they belong to, so linux-signed-aws and " +
    "linux-restricted-modules-aws count towards linux-aws.", "by-flavour");
  barChart(flavCard, {
    labelWidth: 190,
    items: [...byFlav.entries()].sort((a, b) => b[1].v - a[1].v)
      .map(entry => ({ label: D.flavours[entry[0]], value: entry[1].v, n: entry[1].n })),
    rowLabel: d => bytes(d.value),
    tip: d => '<div class="tt-title">' + d.label + "</div>" +
      '<div class="tt-row"><span>size</span><span>' + bytes(d.value) + "</span></div>" +
      '<div class="tt-row"><span>packages</span><span>' + count(d.n) + "</span></div>",
  });
}

function viewTable(host, tl) {
  const sp = tl.split;
  const c = card(host, "Kernel share over time",
    "Every selected " + sp.label + ", including any the charts could not " +
    "colour. The last column counts each file once across the whole selection.", "share-table");
  const wrap = document.createElement("div");
  wrap.className = "tablewrap";
  const sel = [...sp.sel].sort((a, b) => a - b);
  let html = "<table><thead><tr><th>Snapshot</th>";
  for (const s of sel) html += "<th>" + sp.names[s] + "</th>";
  html += "<th>all selected</th></tr></thead><tbody>";
  D.snapshots.forEach((snapshot, i) => {
    if (!tl.totals[i].total) return;
    html += "<tr><td>" + stamp(snapshot) + "</td>";
    for (const s of sel) {
      const cell = (tl.perKey.get(s) || [])[i];
      html += '<td class="num">' +
        (cell && cell.total ? pct(cell.kernel / cell.total) : "-") + "</td>";
    }
    html += '<td class="num">' + pct(tl.totals[i].kernel / tl.totals[i].total) +
            "</td></tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
  c.appendChild(wrap);

  const c2 = card(host, "One snapshot in full",
    "The bytes behind the breakdown charts, at " +
    stamp(D.snapshots[state.snap]) + ".", "snapshot-table");
  const rows = new Map();
  scanClass((s, smask, arch, cls, n, v) => {
    if (s !== state.snap) return;
    for (const ser of state.series) {
      if (!(smask >> ser & 1)) continue;
      const key = D.series[ser] + " " + D.arches[arch];
      const r = rows.get(key) || { kernel: 0, total: 0, kn: 0, n: 0 };
      r.total += v; r.n += n;
      if (cls !== OTHER) { r.kernel += v; r.kn += n; }
      rows.set(key, r);
    }
  });
  let h2 = "<table><thead><tr><th>Series</th><th>Arch</th><th>Kernel</th>" +
           "<th>Total</th><th>Share</th><th>Kernel pkgs</th><th>All pkgs</th>" +
           "</tr></thead><tbody>";
  const totals = { kernel: 0, total: 0, kn: 0, n: 0 };
  [...rows.entries()].sort().forEach(entry => {
    const parts = entry[0].split(" "), r = entry[1];
    totals.kernel += r.kernel; totals.total += r.total;
    totals.kn += r.kn; totals.n += r.n;
    h2 += "<tr><td>" + parts[0] + "</td><td>" + parts[1] + '</td><td class="num">' +
      bytes(r.kernel) + '</td><td class="num">' + bytes(r.total) +
      '</td><td class="num">' + pct(r.total ? r.kernel / r.total : 0) +
      '</td><td class="num">' + count(r.kn) + '</td><td class="num">' +
      count(r.n) + "</td></tr>";
  });
  const dedup = snapshotTotals(state.snap);
  h2 += '<tr class="total"><td>deduped</td><td></td><td class="num">' +
    bytes(dedup.kernel) + '</td><td class="num">' + bytes(dedup.total) +
    '</td><td class="num">' + pct(dedup.total ? dedup.kernel / dedup.total : 0) +
    '</td><td class="num">' + count(dedup.kn) + '</td><td class="num">' +
    count(dedup.n) + "</td></tr></tbody></table>";
  const wrap2 = document.createElement("div");
  wrap2.className = "tablewrap";
  wrap2.innerHTML = h2;
  c2.appendChild(wrap2);
}


/* --------------------------------------------------------- whole archive */

/** A range input over the snapshots that survives its own redraws. */
function snapshotChooser(host, redraw) {
  const chooser = card(host, "Snapshot", "", ALWAYS);
  const row = document.createElement("div");
  row.className = "slider-row";
  const range = document.createElement("input");
  range.type = "range";
  range.min = 0;
  range.max = D.snapshots.length - 1;
  range.value = state.snap;
  const fill = () => {
    range.style.backgroundSize =
      (range.max > 0 ? 100 * range.value / range.max : 0) + "% 100%, auto";
  };
  fill();
  const label = document.createElement("div");
  label.className = "stamp";
  label.textContent = stamp(D.snapshots[state.snap]);
  row.appendChild(label);
  row.appendChild(range);
  chooser.appendChild(row);

  const body = document.createElement("div");
  host.appendChild(body);
  range.addEventListener("input", () => {
    state.snap = +range.value;
    fill();
    label.textContent = stamp(D.snapshots[state.snap]);
    updateTiles();
    body.innerHTML = "";
    redraw(body);
    // Not render(), which would replace the range mid-drag, so the URL has to
    // be told separately.
    syncHash();
  });
  redraw(body);
}

function viewArchive(host) {
  const tl = timeline();
  const live = tl.totals.map((c, i) => (c && c.total ? i : -1)).filter(i => i >= 0);
  if (!live.length) {
    host.innerHTML = '<div class="card"><div class="empty">' +
      "Nothing selected.</div></div>";
    return;
  }
  const firstIdx = live[0], lastIdx = live[live.length - 1];
  const first = tl.totals[firstIdx], last = tl.totals[lastIdx];
  const years = (snapDate(D.snapshots[lastIdx]) - snapDate(D.snapshots[firstIdx]))
                / (365.2425 * 86400 * 1000);
  const growth = last.total - first.total;
  const xs = D.snapshots.map(shortStamp);
  const all = state.series.size === D.series.length;

  const sizeCard = card(host, "Total size of the archive",
    (all ? "Every package published across all " + D.series.length + " series"
         : "Every package published across the " + state.series.size +
           " selected series") +
    ", with each file in pool/ counted once however many of them reference it.", "archive-size");
  lineChart(sizeCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: [
      { name: "whole archive", colour: "var(--s1)",
        points: tl.totals.map(c => (c && c.total ? c.total : null)) },
      { name: "kernels", colour: "var(--s2)",
        points: tl.totals.map(c => (c && c.total ? c.kernel : null)) },
    ],
  });
  legend(sizeCard, [["whole archive", "var(--s1)"], ["kernels", "var(--s2)"]]);
  const sign = growth >= 0 ? "+" : "-";
  const rate = years >= 1
    ? ", " + sign + bytes(Math.abs(growth) / years) + " a year"
    : "";
  note(sizeCard,
    bytes(first.total) + " at " + stamp(D.snapshots[firstIdx]) + " to " +
    bytes(last.total) + " at " + stamp(D.snapshots[lastIdx]) + ": " +
    sign + bytes(Math.abs(growth)) + " over " +
    (years >= 1 ? years.toFixed(1) + " years" : Math.round(years * 12) + " months") +
    rate + ", and kernels went from " +
    pct(first.total ? first.kernel / first.total : 0) + " of it to " +
    pct(last.total ? last.kernel / last.total : 0) + ".");

  const splitCard = card(host, "Archive size, per " + tl.split.label,
    tl.split.key === "arch"
      ? "One line per architecture. 'all' and 'source' are lines of their own: " +
        "the archive keeps one copy of each, not one per architecture."
      : "One line per series. A file two series share is counted in both, so " +
        "these add up to more than the line above.", "archive-size-by-split");
  const sizeLines = splitLines(tl, c => c.total);
  lineChart(splitCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: sizeLines.series,
  });
  legend(splitCard, sizeLines.series.map(l => [l.name, l.colour, l.dash]));

  const shareCard = card(host, "Kernel share of the whole archive",
    "The two lines from the first chart as a ratio.", "archive-share");
  lineChart(shareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    diffFmt: v => v.toFixed(1) + " pp",
    logFmt: v => (v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1)
                                                  : v.toFixed(2)) + "%",
    minMax: 10,
    height: 240,
    series: [{ name: "kernel share", colour: "var(--s1)",
               points: tl.totals.map(
                 c => (c && c.total ? 100 * c.kernel / c.total : null)) }],
  });

  snapshotChooser(host, body => {
    const byArch = new Map();
    scanClass((snap, smask, arch, cls, n, v) => {
      if (snap !== state.snap) return;
      let a = byArch.get(arch);
      if (!a) byArch.set(arch, a = { kernel: 0, total: 0, n: 0 });
      a.total += v;
      if (cls !== OTHER) { a.kernel += v; a.n += n; }
    });
    const c = card(body, "The archive by architecture",
      "At " + stamp(D.snapshots[state.snap]) + ". Solid bar: kernel packages.", "archive-by-arch");
    barChart(c, {
      labelWidth: 92,
      items: [...byArch.entries()].sort((a, b) => b[1].total - a[1].total)
        .map(entry => ({
          label: D.arches[entry[0]], value: entry[1].kernel,
          total: entry[1].total, n: entry[1].n,
        })),
      rowLabel: d => pct(d.total ? d.value / d.total : 0) + " of " + bytes(d.total),
      tip: d => '<div class="tt-title">' + d.label + "</div>" +
        '<div class="tt-row"><span>kernel</span><span>' + bytes(d.value) + "</span></div>" +
        '<div class="tt-row"><span>everything</span><span>' + bytes(d.total) + "</span></div>" +
        '<div class="tt-row"><span>share</span><span>' +
        pct(d.total ? d.value / d.total : 0) + "</span></div>",
    });
    legend(c, [["kernel packages", "var(--s1)"],
               ["everything published", "var(--neutral-fill)"]]);

    const t = card(body, "The numbers", "");
    const wrap = document.createElement("div");
    wrap.className = "tablewrap";
    let html = "<table><thead><tr><th>Snapshot</th><th>Archive</th>" +
               "<th>Kernels</th><th>Share</th><th>Packages</th></tr></thead><tbody>";
    tl.totals.forEach((cell, i) => {
      if (!cell || !cell.total) return;
      html += "<tr><td>" + stamp(D.snapshots[i]) + '</td><td class="num">' +
        bytes(cell.total) + '</td><td class="num">' + bytes(cell.kernel) +
        '</td><td class="num">' + pct(cell.total ? cell.kernel / cell.total : 0) +
        '</td><td class="num">' + count(cell.n) + "</td></tr>";
    });
    html += "</tbody></table>";
    wrap.innerHTML = html;
    t.appendChild(wrap);
  });

}

/* ------------------------------------------------------------ the lists */

function viewLists(host) {
  const il = indexTimeline();
  const live = il.totals.map((c, i) => (c.files ? i : -1)).filter(i => i >= 0);
  if (!live.length) {
    host.innerHTML = '<div class="card"><div class="empty">' +
      "No index files in this selection. Note that 'all' is not an index " +
      "directory of its own: an Architecture: all package is listed once in " +
      "every binary-&lt;arch&gt; index, so ticking only 'all' leaves nothing " +
      "to measure.</div></div>";
    return;
  }
  const tl = timeline();
  const xs = D.snapshots.map(shortStamp);
  const firstIdx = live[0], lastIdx = live[live.length - 1];
  const first = il.totals[firstIdx], last = il.totals[lastIdx];

  const sizeCard = card(host, "Size of the package lists",
    "The indexes themselves rather than the packages they point at: what apt " +
    "fetches on 'apt update'. Compressed is the .xz the archive publishes, " +
    "which is the copy this tool downloads; mirrors serve a .gz of every list " +
    "as well, so a mirror carries rather more than this.", "lists-size");
  lineChart(sizeCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: [
      { name: "uncompressed", colour: "var(--s2)",
        points: il.totals.map(c => (c.files ? c.usize : null)) },
      { name: "compressed", colour: "var(--s1)",
        points: il.totals.map(c => (c.files ? c.csize : null)) },
    ],
  });
  legend(sizeCard, [["uncompressed", "var(--s2)"],
                    ["compressed (.xz)", "var(--s1)"]]);
  const archiveNow = tl.totals[lastIdx] ? tl.totals[lastIdx].total : 0;
  note(sizeCard,
    count(last.files) + " index files at " + stamp(D.snapshots[lastIdx]) +
    " holding " + bytes(last.csize) + " compressed and " + bytes(last.usize) +
    " raw, up from " + count(first.files) + " and " + bytes(first.csize) +
    " at " + stamp(D.snapshots[firstIdx]) + "." +
    (archiveNow
      ? " The compressed lists are " + pctFine(last.csize / archiveNow) +
        " of the " + bytes(archiveNow) + " of packages they describe."
