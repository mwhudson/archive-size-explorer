  const splitCard = card(host, "Package lists, per " + il.split.label,
    "Compressed size, one line per " + il.split.label + ". Nothing is shared " +
    "between the lines: every index belongs to exactly one series and one " +
    "architecture, so unlike the other tabs these do add up to the total.", "lists-by-split");
  const sizeLines = splitLines(il, c => c.csize);
  lineChart(splitCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: sizeLines.series,
  });
  legend(splitCard, sizeLines.series.map(l => [l.name, l.colour, l.dash]));
  const allArch = D.arches.indexOf("all");
  if (il.split.key === "arch" && state.arch.has(allArch)) {
    note(splitCard, "'all' has no line because it has no index directory: an " +
         "Architecture: all package is listed under every real architecture, " +
         "and is counted there.");
  }

  const byPocket = indexTimelineBy(pocketSplit(), (s, a, c, p) => p);
  const byComp = indexTimelineBy(componentSplit(), (s, a, c) => c);

  const pocketCard = card(host, "Package lists, per pocket",
    "Compressed size. The release pocket is most of the length of the lists " +
    "and almost none of the kernels in them: it is frozen on release day, so " +
    "every ABI published since lands in -updates and -security instead.", "lists-by-pocket");
  const pocketSize = splitLines(byPocket, c => c.csize);
  lineChart(pocketCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: pocketSize.series,
  });
  legend(pocketCard, pocketSize.series.map(l => [l.name, l.colour, l.dash]));

  const compCard = card(host, "Package lists, per component",
    "Compressed size. universe is most of what makes the lists long, and " +
    "almost none of what makes them kernels.", "lists-by-component");
  const compSize = splitLines(byComp, c => c.csize);
  lineChart(compCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: compSize.series,
  });
  legend(compCard, compSize.series.map(l => [l.name, l.colour, l.dash]));

  const bySuite = indexTimelineBy(suiteSplit(), (s, a, c, p) => s * NPOCK + p);
  const suiteCard = card(host, "Package lists, per suite",
    "Compressed size, one line per series-and-pocket pair -- what a " +
    "sources.list line actually names. Every ticked series crossed with " +
    "every pocket is many more lines than there are colours, so this one " +
    "wants filtering: narrow to a series or two and it shows how a " +
    "release's lists divide between the pocket frozen on release day and " +
    "the ones that grow afterwards.", "lists-by-suite");
  const suiteSize = splitLines(bySuite, c => c.csize);
  lineChart(suiteCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: suiteSize.series,
  });
  legend(suiteCard, suiteSize.series.map(l => [l.name, l.colour, l.dash]));

  const entCard = card(host, "Entries in the package lists",
    "One entry per stanza, counted as the indexes list them rather than as " +
    "the pool stores them: a package published to both -updates and -security " +
    "is two entries, and an Architecture: all package is one entry under every " +
    "architecture. That is what makes a list long to parse, and it is not how " +
    "the other tabs count packages.", "lists-entries");
  lineChart(entCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: count,
    series: [
      { name: "all entries", colour: "var(--s2)",
        points: il.totals.map(c => (c.files ? c.n : null)) },
      { name: "kernel entries", colour: "var(--s1)",
        points: il.totals.map(c => (c.files ? c.kn : null)) },
    ],
  });
  legend(entCard, [["all entries", "var(--s2)"], ["kernel entries", "var(--s1)"]]);

  const shareCard = card(host, "How much of the lists is kernels",
    "Kernel entries as a share of all entries, against the kernel share of " +
    "the archive's bytes for comparison. Kernel packages are few and enormous, " +
    "so the two answers to 'how much of this is kernels' are nothing alike.", "lists-share");
  lineChart(shareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    diffFmt: v => v.toFixed(1) + " pp",
    logFmt: v => (v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1)
                                                  : v.toFixed(2)) + "%",
    minMax: 10,
    height: 260,
    series: [
      { name: "of archive bytes", colour: "var(--s2)",
        points: tl.totals.map(c => (c && c.total ? 100 * c.kernel / c.total : null)) },
      { name: "of list entries", colour: "var(--s1)",
        points: il.totals.map(c => (c.n ? 100 * c.kn / c.n : null)) },
    ],
  });
  legend(shareCard, [["of archive bytes", "var(--s2)"],
                     ["of list entries", "var(--s1)"]]);

  const kshare = c => (c.n ? 100 * c.kn / c.n : null);

  const pocketShareCard = card(host, "Kernel share of the lists, per pocket",
    "The same ratio within each pocket's own indexes. Untick release in the " +
    "filter above and the overall figure jumps to meet these.", "lists-share-by-pocket");
  const pocketShare = splitLines(byPocket, kshare);
  lineChart(pocketShareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    diffFmt: v => v.toFixed(1) + " pp",
    logFmt: v => (v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1)
                                                  : v.toFixed(2)) + "%",
    minMax: 10,
    height: 260,
    series: pocketShare.series,
  });
  legend(pocketShareCard, pocketShare.series.map(l => [l.name, l.colour, l.dash]));

  const compShareCard = card(host, "Kernel share of the lists, per component",
    "restricted is where linux-restricted-modules and its linux-objects-* " +
    "live, which is why it is the most kernel-dense component even though " +
    "main carries the kernels themselves.", "lists-share-by-component");
  const compShare = splitLines(byComp, kshare);
  lineChart(compShareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    diffFmt: v => v.toFixed(1) + " pp",
    logFmt: v => (v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1)
                                                  : v.toFixed(2)) + "%",
    minMax: 10,
    height: 260,
    series: compShare.series,
  });
  legend(compShareCard, compShare.series.map(l => [l.name, l.colour, l.dash]));

  snapshotChooser(host, body => {
    const byArch = new Map();
    scanIndex((snap, ser, arch, comp, pocket, n, kn, c, u) => {
      if (snap !== state.snap) return;
      let a = byArch.get(arch);
      if (!a) byArch.set(arch, a = { n: 0, kn: 0, csize: 0, files: 0 });
      a.n += n; a.kn += kn; a.csize += c; a.files++;
    });
    const ac = card(body, "The lists by architecture",
      "At " + stamp(D.snapshots[state.snap]) + ". Solid bar: kernel entries. " +
      "'source' is the Sources indexes; there is no 'all' row because " +
      "Architecture: all packages are listed under each real architecture.", "lists-by-arch");
    barChart(ac, {
      labelWidth: 92,
      items: [...byArch.entries()].sort((a, b) => b[1].n - a[1].n)
        .map(entry => ({
          label: D.arches[entry[0]], value: entry[1].kn,
          total: entry[1].n, csize: entry[1].csize, files: entry[1].files,
        })),
      rowLabel: d => pct(d.total ? d.value / d.total : 0) + " of " +
        count(d.total) + " entries",
      tip: d => '<div class="tt-title">' + d.label + "</div>" +
        '<div class="tt-row"><span>index files</span><span>' + count(d.files) + "</span></div>" +
        '<div class="tt-row"><span>entries</span><span>' + count(d.total) + "</span></div>" +
        '<div class="tt-row"><span>kernel entries</span><span>' + count(d.value) + "</span></div>" +
        '<div class="tt-row"><span>compressed</span><span>' + bytes(d.csize) + "</span></div>",
    });
    legend(ac, [["kernel entries", "var(--s1)"],
                ["every entry", "var(--neutral-fill)"]]);

    const t = card(body, "The numbers", "");
    const wrap = document.createElement("div");
    wrap.className = "tablewrap";
    let html = "<table><thead><tr><th>Snapshot</th><th>Indexes</th>" +
      "<th>Entries</th><th>Kernel</th><th>Share</th><th>Compressed</th>" +
      "<th>Uncompressed</th><th>Of archive</th></tr></thead><tbody>";
    il.totals.forEach((c, i) => {
      if (!c.files) return;
      const arch = tl.totals[i] ? tl.totals[i].total : 0;
      html += "<tr><td>" + stamp(D.snapshots[i]) + '</td><td class="num">' +
        count(c.files) + '</td><td class="num">' + count(c.n) +
        '</td><td class="num">' + count(c.kn) + '</td><td class="num">' +
        pct(c.n ? c.kn / c.n : 0) + '</td><td class="num">' + bytes(c.csize) +
        '</td><td class="num">' + bytes(c.usize) + '</td><td class="num">' +
        (arch ? pctFine(c.csize / arch) : "-") + "</td></tr>";
    });
    html += "</tbody></table>";
    wrap.innerHTML = html;
    t.appendChild(wrap);
  });
}

/* ------------------------------------------------------------ card helpers */

// A card that stays put when one chart is focused, and is never itself a
// focus target: the snapshot chooser is a control the charts beside it depend
// on, so hiding it would strand whoever focused one of them.
const ALWAYS = "always";

function card(host, title, sub, key) {
  const c = document.createElement("div");
  c.className = "card p-card";
  const h = document.createElement("h2");
  const name = document.createElement("span");
  name.textContent = title;
  h.appendChild(name);
  // A card with a key can be focused: the others are still built, but never
  // attached, so no view needs to know this is happening.
  if (key && key !== ALWAYS) {
    const z = document.createElement("button");
    z.className = "p-button is-small is-dense";
    z.type = "button";
    z.textContent = state.zoom === key ? "show all" : "focus";
    z.title = state.zoom === key
      ? "bring back the other charts on this tab"
      : "hide the other charts and draw this one larger";
    z.setAttribute("aria-pressed", state.zoom === key ? "true" : "false");
    z.addEventListener("click", () => {
      state.zoom = state.zoom === key ? null : key;
      render();
    });
    h.appendChild(z);
  }
  c.appendChild(h);
  if (sub) {
    const s = document.createElement("div");
    s.className = "cardsub";
    s.textContent = sub;
    c.appendChild(s);
  }
  const body = document.createElement("div");
  body.className = "chartbox";
  c.appendChild(body);
  if (key === ALWAYS || !state.zoom || state.zoom === key) {
    host.appendChild(c);
    if (key && state.zoom === key) zoomFound = true;
  }
  return body;
}

function legend(host, entries) {
  if (entries.length < 2) return;   // one series is named by its own end label
  const box = document.createElement("div");
  box.className = "legend";
  // Once any entry is dashed the keys become little lines rather than blocks,
  // all of them, so that solid and dashed are compared like with like and the
  // key looks like the mark it stands for.
  const anyDash = entries.some(e => e[2]);
  for (const entry of entries) {
    const item = document.createElement("span");
    item.className = "item";
    const key = document.createElement("span");
    key.className = anyDash ? "key line" : "key";
    key.style.background = entry[2]
      ? "repeating-linear-gradient(90deg, " + entry[1] + " 0 5px, " +
        "transparent 5px 8px)"
      : entry[1];
    item.appendChild(key);
    item.appendChild(document.createTextNode(entry[0]));
    box.appendChild(item);
  }
  host.parentNode.appendChild(box);
}

/** Why some lines stop before the right-hand edge.
 *
 *  The tables are what the archive carried, not what the snapshot service
 *  holds: the service keeps a suite it has ingested and goes on serving its
 *  last state, so without this the removed series would run on forever.  A
 *  file one of them shared with a surviving series is still counted, because
 *  it is still on the mirror -- only what nobody else references goes.
 */
function removedText() {
  const gone = DATA.mirrorRemoved;
  if (!gone) return "";
  const names = Object.keys(gone).sort(
    (a, b) => D.series.indexOf(a) - D.series.indexOf(b));
  if (!names.length) return "";
  return names.map(n => n + " (" + gone[n] + ")").join(", ") +
    " are counted only up to the point they left archive.ubuntu.com, which " +
    "is why their lines stop. Those dates come from the Internet Archive's " +
    "captures of the archive's index, nothing in the archive itself " +
    "recording a removal. The snapshot service keeps serving an EOL suite " +
    "indefinitely, so counting one after that point would describe the " +
    "service rather than a mirror. Files such a series shared with one still " +
    "carried are unaffected.";
}

/** Which series are the present held constant rather than real history.
 *
 *  The snapshot service has no record of these -- it only ever saw suites
 *  published after it came online, and these were last published before that
 *  -- so they are read from the live archive.  For a suite that has not been
 *  published since before the window opened, today's content *is* its content
 *  throughout, which is why this is an inference rather than an invention.
 *  Where that does not hold it is said plainly.
 */
function liveText() {
  const names = DATA.liveSeries;
  if (!names || !names.length) return "";
  return names.join(" and ") + " are read from archive.ubuntu.com, not " +
    "from the snapshot service, which has no record of them: it carries only " +
    "what has been published since it came online in 2023, and their release " +
    "pockets were last published in 2014 and 2016. A suite unpublished since " +
    "before the window cannot have changed during it, so today's content is " +
    "its content throughout. The exception is trusty's updates, security, " +
    "proposed and backports pockets, which are still published but absent " +
    "from the service: those are today's value held flat, so trusty is a " +
    "little overstated early on.";
}

function note(host, text) {
  const n = document.createElement("div");
  n.className = "cardsub";
  n.style.marginTop = "10px";
  n.textContent = text;
  host.parentNode.appendChild(n);
}

/* ------------------------------------------------------------------ render */

function updateTiles() {
  const cur = snapshotTotals(state.snap);
  const archive = state.series.size === D.series.length;
  const scope = archive ? "whole archive" : "selected series";
  document.getElementById("tile-kernel").textContent = bytes(cur.kernel);
  document.getElementById("tile-kernel-note").textContent =
    count(cur.kn) + " packages at " + stamp(D.snapshots[state.snap]);
  document.getElementById("tile-other-label").textContent =
    archive ? "REST OF THE ARCHIVE" : "EVERYTHING ELSE";
  document.getElementById("tile-other").textContent = bytes(cur.total - cur.kernel);
  document.getElementById("tile-other-note").textContent =
    count(cur.n - cur.kn) + " packages";
  document.getElementById("tile-share").textContent =
    cur.total ? pct(cur.kernel / cur.total) : "-";
  document.getElementById("tile-total").textContent = bytes(cur.total);
  document.getElementById("tile-total-note").textContent =
    (archive ? "all " + D.series.length : state.series.size + " of " +
     D.series.length) + " series at " + stamp(D.snapshots[state.snap]);
  // The total has a tile of its own now, so repeating it here would just be
  // noise; what the share still needs is what it is a share *of*.
  document.getElementById("tile-share-note").textContent = "of the " + scope;
}

function render() {
  // The tab is removed at load for a dataset that predates the index table,
  // but do not make the dispatch depend on that having happened.
  if (state.view === "lists" && !DATA.byIndex) state.view = DEFAULTS.view;
  assignSlots();
  buildFilters();
  updateTiles();

  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.view === state.view ? "true" : "false"));

  const host = document.getElementById("views");
  host.innerHTML = "";
  zoomFound = false;
  if (!state.series.size || !state.arch.size || !state.pocket.size || !state.comp.size) {
    host.innerHTML = '<div class="card"><div class="empty">' +
      "Select at least one of each filter.</div></div>";
    syncHash();
    return;
  }
  if (state.shown !== "total" && state.view !== "breakdown" &&
      state.view !== "table") {
    const bar = document.createElement("div");
    bar.className = "cardsub";
    bar.style.margin = "0 0 14px";
    if (state.shown === "log") {
      bar.textContent =
        "The vertical axis below is logarithmic. A straight line is steady " +
        "percentage growth and its slope is the rate, so a line that is " +
        "flattening is growing more slowly even while it still climbs, and " +
        "series orders of magnitude apart in size are all readable at once. " +
        "A value of zero has no position on this axis and leaves a gap.";
    } else {
      const n = windowSnapshots(state.rateWindow);
      bar.textContent =
        "Every line below is how fast the value is changing, averaged over " +
        "the trailing " + state.rateWindow +
        (state.rateWindow === 1 ? " month" : " months") + " -- " + n +
        (n === 1 ? " snapshot" : " snapshots") + " at this resolution -- and " +
        "quoted per month. A point above the zero line is growing, one below " +
        "it is shrinking. A line starts only once there is a full window " +
        "behind it.";
    }
    host.appendChild(bar);
  }
  if (state.view === "lists") viewLists(host);
  else if (state.view === "archive") viewArchive(host);
  else if (state.view === "breakdown") viewBreakdown(host);
  else if (state.view === "time") viewTime(host, timeline());
  else viewTable(host, timeline());

  // A focus key out of a link may name no card on this tab -- another tab's
  // chart, or one that has since been renamed.  Drop it and draw the lot
  // rather than show an empty tab; clearing it first means this cannot
  // recurse past one retry.
  if (state.zoom && !zoomFound) {
    state.zoom = null;
    render();
    return;
  }
  syncHash();
}

// --from-json can replay a dataset built before the index table existed.
if (!DATA.byIndex) {
  const stale = document.querySelector('.tab[data-view="lists"]');
  if (stale) stale.remove();
  if (state.view === "lists") state.view = DEFAULTS.view;
}

document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => { state.view = t.dataset.view; render(); }));

document.getElementById("filterbtn").addEventListener("click", () => {
  state.filters = !state.filters;
  render();
});

document.getElementById("resetbtn").addEventListener("click", () => {
  resetDefaults();
  render();
});

document.getElementById("themebtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--is-dark").trim() === "1";
  root.setAttribute("data-theme", dark ? "light" : "dark");
  render();
});

document.getElementById("generated").textContent =
  "snapshot.ubuntu.com | " + stamp(D.snapshots[0]) + " to " +
  stamp(D.snapshots[D.snapshots.length - 1]) + " | built " + DATA.generated;

// Everything about how the numbers are arrived at, in one collapsed block.
// It used to be four paragraphs of standing text here plus the same two
// provenance notes repeated under a chart on each of two tabs, which made
// every chart look like it needed defending.  A <details> needs no script,
// survives being saved to a file, and keeps its state across re-renders
// because the footer is written once.
const NOTES = [
  "A package counts as a kernel package when its source ships a binary that " +
  "<code>Provides: linux-image</code>, plus any " +
  "<code>linux-objects-*-&lt;kver&gt;</code> built for a kernel version seen " +
  "in those images - the same rule as the <code>kernel-sizes</code> script.",

  "A file published to several pockets is counted once, so the totals are " +
  "what the archive actually stores rather than the sum of the indexes.",

  "Series share one pool/ too, so every total counts a shared file once for " +
  "the set you have ticked. The one place that does not hold is a per-series " +
  "line or row: a file jammy and noble both reference belongs to each of " +
  "their sizes, so those add up to more than the archive holds. The Archive " +
  "size tab and the last column of Tables count each file once.",

  "Where more lines are drawn than there are hues, the hues come round " +
  "again and each repeat is dashed, so a line is named by its colour and " +
  "dash together. A dash means nothing else: the legend says which line is " +
  "which.",

  "Package lists is the exception to all of that. It measures the indexes " +
  "rather than the pool, so it counts stanzas as the archive publishes them: " +
  "once per pocket, and once per architecture for an Architecture: all " +
  "package. Sizes there come from the Release files, not from the packages.",

  removedText(),
  liveText(),
];

document.getElementById("footer").innerHTML =
  "<details><summary>How these numbers are counted</summary>" +
  NOTES.filter(Boolean).map(t => "<p>" + t + "</p>").join("") +
  "</details>" +
  "Generated by " +
  "<a href=\"https://github.com/mwhudson/archive-size-explorer\">" +
  "archive-size-explorer</a>.";

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});

// Someone editing the hash, following a link into the same page, or using the
// back button after a file:// fallback write.  The hash is the whole state,
// so start from the defaults and let it override.
//
// A hash that already says what the page shows is our own write coming back:
// syncHash's file:// fallback assigns location.hash, and the event for that
// arrives later, as a task of its own.  Rendering then would replace the
// snapshot slider while it is being dragged.
window.addEventListener("hashchange", () => {
  if (location.hash.replace(/^#/, "") === encodeState()) return;
  resetDefaults();
  state.view = DEFAULTS.view;
  state.zoom = null;
  applyHash(location.hash);
  render();
});

applyHash(location.hash);
render();
})();
</script>
</body>
</html>
