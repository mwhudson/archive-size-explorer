<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernels in the Ubuntu archive</title>
<style>
:root {
  color-scheme: light;
  --page:           #f9f9f7;
  --surface:        #fcfcfb;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --muted:          #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --chip:           #ffffff;
  --chip-on:        #0b0b0b;
  --chip-on-text:   #fcfcfb;
  --neutral-fill:   #e6e5df;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255,255,255,0.10);
    --chip:           #232322;
    --chip-on:        #fcfcfb;
    --chip-on-text:   #0b0b0b;
    --neutral-fill:   #34343180;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:           #0d0d0d;
  --surface:        #1a1a19;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --muted:          #898781;
  --grid:           #2c2c2a;
  --axis:           #383835;
  --border:         rgba(255,255,255,0.10);
  --chip:           #232322;
  --chip-on:        #fcfcfb;
  --chip-on-text:   #0b0b0b;
  --neutral-fill:   #34343180;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }
header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.sub { color: var(--text-secondary); font-size: 13px; }
.spacer { flex: 1; }
button.plain {
  font: inherit; background: var(--chip); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px;
  cursor: pointer;
}
button.plain:hover { color: var(--text-primary); }

.tiles { display: flex; gap: 12px; flex-wrap: wrap; margin: 22px 0 8px; }
.tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 18px; min-width: 190px; flex: 1;
}
.tile .label { color: var(--text-secondary); font-size: 12px; letter-spacing: 0.02em; }
.tile .value { font-size: 28px; font-weight: 620; margin-top: 2px; letter-spacing: -0.02em; }
.tile .note { color: var(--muted); font-size: 12px; margin-top: 2px; }

.filters {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 4px 16px 14px; margin: 16px 0 20px;
}
.frow { display: flex; gap: 10px; align-items: flex-start; padding-top: 10px; flex-wrap: wrap; }
.frow > .flabel {
  color: var(--text-secondary); font-size: 12px; width: 88px;
  flex: none; padding-top: 5px; text-transform: uppercase; letter-spacing: 0.04em;
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.chip {
  font: inherit; font-size: 12.5px; background: var(--chip);
  color: var(--text-secondary); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 11px; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip:hover { color: var(--text-primary); }
.chip[aria-pressed="true"] {
  background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on);
}
.chip .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.chip .allnone { font-size: 11px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab {
  font: inherit; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--text-secondary); padding: 8px 14px; cursor: pointer; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-primary); font-weight: 560; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px 20px 14px; margin-bottom: 18px;
}
.card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.card .cardsub { color: var(--text-secondary); font-size: 12.5px; margin-bottom: 12px; }
.chartbox { width: 100%; overflow-x: auto; }
svg { display: block; }
svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
svg .axislabel { fill: var(--text-secondary); }
svg .endlabel { font-size: 11px; font-weight: 560; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.legend .key { width: 10px; height: 10px; border-radius: 3px; flex: none; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 560; font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 620; border-top: 1px solid var(--axis); }
.tablewrap { overflow-x: auto; }

.tooltip {
  position: fixed; pointer-events: none; z-index: 20; opacity: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.14); transition: opacity .08s;
  max-width: 280px;
}
.tooltip .tt-title { font-weight: 600; margin-bottom: 4px; }
.tooltip .tt-row { display: flex; gap: 10px; justify-content: space-between; }
.tooltip .tt-row span:last-child { font-variant-numeric: tabular-nums; }

.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--s1); }
.slider-row .stamp { font-variant-numeric: tabular-nums; color: var(--text-secondary); min-width: 74px; }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }
footer { color: var(--muted); font-size: 12px; margin-top: 28px; line-height: 1.7; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Kernels in the Ubuntu archive</h1>
  <div class="sub" id="generated"></div>
  <div class="spacer"></div>
  <button class="plain" id="resetbtn" type="button">Reset</button>
  <button class="plain" id="themebtn" type="button">Theme</button>
</header>

<div class="tiles">
  <div class="tile">
    <div class="label">KERNEL PACKAGES</div>
    <div class="value" id="tile-kernel">–</div>
    <div class="note" id="tile-kernel-note"></div>
  </div>
  <div class="tile">
    <div class="label" id="tile-other-label">EVERYTHING ELSE</div>
    <div class="value" id="tile-other">–</div>
    <div class="note" id="tile-other-note"></div>
  </div>
  <div class="tile">
    <div class="label">KERNEL SHARE</div>
    <div class="value" id="tile-share">–</div>
    <div class="note" id="tile-share-note"></div>
  </div>
</div>

<div class="filters" id="filters"></div>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-view="time" aria-selected="true">Over time</button>
  <button class="tab" role="tab" data-view="breakdown" aria-selected="false">Breakdown</button>
  <button class="tab" role="tab" data-view="table" aria-selected="false">Table</button>
  <button class="tab" role="tab" data-view="archive" aria-selected="false">Whole archive</button>
  <button class="tab" role="tab" data-view="lists" aria-selected="false">Package lists</button>
</div>

<div id="views"></div>

<footer id="footer"></footer>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
const DATA = /*DATA*/null/*DATA*/;
</script>
<script>
"use strict";

const D = DATA.dims;
const OTHER = D.classes.indexOf(DATA.otherClass);
const SLOTS = 8;                       // categorical slots; never cycled

// Colour follows the entity, not its rank: once a series holds a slot it keeps
// it until it is deselected, so filtering never repaints the survivors.  There
// are only SLOTS colours and none are ever reused or generated, so a selection
// wider than that leaves the extras uncoloured -- they stay in the table.
// Colour follows the entity, not its rank: once a key holds a slot it keeps
// it until deselected, so filtering never repaints the survivors.  There are
// only SLOTS colours and none are ever reused or generated, so a selection
// wider than that leaves the extras uncoloured -- they stay in the table.
function Slots() { this.map = new Map(); }

Slots.prototype.assign = function (selected) {
  for (const k of [...this.map.keys()]) {
    if (!selected.has(k)) this.map.delete(k);
  }
  const used = new Set(this.map.values());
  for (const k of [...selected].sort((a, b) => a - b)) {
    if (this.map.has(k)) continue;
    for (let i = 0; i < SLOTS; i++) {
      if (!used.has(i)) { this.map.set(k, i); used.add(i); break; }
    }
  }
};
Slots.prototype.colour = function (k) {
  return this.map.has(k) ? "var(--s" + (this.map.get(k) + 1) + ")" : null;
};
Slots.prototype.drawable = function (selected) {
  return [...selected].sort((a, b) => a - b).filter(k => this.map.has(k));
};

const seriesSlots = new Slots();
const archSlots = new Slots();
// Pocket and component are filters on every other tab.  On Package lists they
// are also drawn as lines, because an index file belongs to exactly one of
// each -- so they get slots of their own.  Both are well inside SLOTS, so
// nothing is ever dropped for want of a colour.
const pocketSlots = new Slots();
const compSlots = new Slots();
const seriesColour = k => seriesSlots.colour(k);
const archColour = k => archSlots.colour(k);

function assignSlots() {
  seriesSlots.assign(state.series);
  archSlots.assign(state.arch);
  pocketSlots.assign(state.pocket);
  compSlots.assign(state.comp);
}

/** Whichever dimension the charts are currently drawing one line per. */
function split() {
  return state.splitBy === "arch"
    ? { key: "arch", names: D.arches, sel: state.arch, slots: archSlots,
        label: "architecture" }
    : { key: "series", names: D.series, sel: state.series, slots: seriesSlots,
        label: "series" };
}

/* ------------------------------------------------------------------ state */

// The series that are still moving.  "Present at the most recent snapshot" is
// no use as a test: the snapshot service keeps EOL suites served forever,
// frozen at whatever they held on their last day, so kinetic is just as
// present in 2026 as noble is.  A series that has not changed size since the
// snapshot before is one of those fossils, and is left unticked.
function activeSeries() {
  const last = D.snapshots.length - 1;
  const rows = DATA.byClass.rows;
  const now = new Array(D.series.length).fill(0);
  const before = new Array(D.series.length).fill(0);
  for (let i = 0; i < rows.length; i += 9) {
    const bucket = rows[i] === last ? now : (rows[i] === last - 1 ? before : null);
    if (!bucket) continue;
    const mask = rows[i + 1], size = rows[i + 7];
    for (let ser = 0; ser < D.series.length; ser++) {
      if (mask >> ser & 1) bucket[ser] += size;
    }
  }
  const active = [];
  for (let ser = 0; ser < D.series.length; ser++) {
    if (now[ser] && now[ser] !== before[ser]) active.push(ser);
  }
  const candidates = active.length
    ? active
    : now.map((v, i) => (v ? i : -1)).filter(i => i >= 0);
  const picked = new Set(candidates.sort((a, b) => b - a).slice(0, SLOTS));
  return picked.size ? picked : new Set(D.series.map((_, i) => i));
}

// What the page opens with, and what Reset puts back.  Kept as its own object
// rather than only as the starting state, so "select default" on the series
// row has something to point at after you have clicked around.
const DEFAULTS = {
  series: activeSeries(),
  arch: new Set(D.arches.map((_, i) => i)),
  pocket: new Set(DATA.pockets.map((_, i) => i)),
  comp: new Set(D.components.map((_, i) => i)),
  metric: "size",
  splitBy: "series",
  snap: D.snapshots.length - 1,
};

/** Refill a selection in place; the chip handlers close over the Set itself. */
function setTo(target, source) {
  target.clear();
  for (const v of source) target.add(v);
}

const state = {
  series: new Set(DEFAULTS.series),
  arch: new Set(DEFAULTS.arch),
  pocket: new Set(DEFAULTS.pocket),
  comp: new Set(DEFAULTS.comp),
  metric: DEFAULTS.metric,
  splitBy: DEFAULTS.splitBy,
  view: "time",
  snap: DEFAULTS.snap,
};

/** Every filter and control back to what the page opened with.  Which tab you
    are on is navigation rather than a filter, so it is left where it is. */
function resetDefaults() {
  setTo(state.series, DEFAULTS.series);
  setTo(state.arch, DEFAULTS.arch);
  setTo(state.pocket, DEFAULTS.pocket);
  setTo(state.comp, DEFAULTS.comp);
  state.metric = DEFAULTS.metric;
  state.splitBy = DEFAULTS.splitBy;
  state.snap = DEFAULTS.snap;
}

/* -------------------------------------------------------------- formatting */

function bytes(n) {
  const units = ["B", "KiB", "MiB", "GiB", "TiB", "PiB"];
  let u = 0;
  while (Math.abs(n) >= 1024 && u < units.length - 1) { n /= 1024; u++; }
  return (n >= 100 || u === 0 ? n.toFixed(0) : n.toFixed(1)) + " " + units[u];
}
function pct(n) { return (n * 100).toFixed(1) + "%"; }
// Some of these are genuinely tiny -- the package lists are 0.016% of the
// archive they describe, which pct() would round away to 0.0%.
function pctFine(n) {
  const v = n * 100;
  return (v >= 1 ? v.toFixed(1) : v >= 0.1 ? v.toFixed(2) : v.toFixed(3)) + "%";
}
function count(n) { return n.toLocaleString(); }
function stamp(s) { return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8); }
function snapDate(s) { return new Date(stamp(s) + "T00:00:00Z"); }
function shortStamp(s) { return s.slice(0, 4) + "-" + s.slice(4, 6); }

/* -------------------------------------------------------------- scanning */

function pocketMask() {
  let m = 0;
  for (const p of state.pocket) m |= 1 << p;
  return m;
}
const metricIdx = () => (state.metric === "size" ? 7 : 8);

// A row's mask is every pocket the file appears in; it is included when the
// selection touches any of them, and counted once. That is exactly the union
// of the selected pockets, which is what the archive holds on disk.
function seriesMask() {
  let m = 0;
  for (const s of state.series) m |= 1 << s;
  return m;
}

// Both masks work the same way: a row carries every pocket, and every series,
// that references its file, and is included -- once -- when the selection
// touches any of them.  That is the union of what you ticked, which is what
// the archive holds on disk, rather than the sum of the indexes.
function scanClass(fn) {
  const rows = DATA.byClass.rows, pm = pocketMask(), sm = seriesMask();
  const vi = metricIdx();
  for (let i = 0; i < rows.length; i += 9) {
    if (!(rows[i + 4] & pm)) continue;
    if (!(rows[i + 1] & sm)) continue;
    if (!state.arch.has(rows[i + 2])) continue;
    if (!state.comp.has(rows[i + 3])) continue;
    fn(rows[i], rows[i + 1], rows[i + 2], rows[i + 5], rows[i + 6], rows[i + vi]);
  }
}

function scanFlavour(fn) {
  const rows = DATA.byFlavour.rows, pm = pocketMask(), sm = seriesMask();
  const vi = metricIdx() - 1;   // stride 8: count at 5, size 6, isize 7
  for (let i = 0; i < rows.length; i += 8) {
    if (!(rows[i + 3] & pm)) continue;
    if (!(rows[i + 1] & sm)) continue;
    if (!state.arch.has(rows[i + 2])) continue;
    fn(rows[i], rows[i + 1], rows[i + 2], rows[i + 4], rows[i + 5], rows[i + vi]);
  }
}

// byIndex is one row per index file: snapshot, series, arch, component,
// pocket, entries, kernel entries, compressed bytes, uncompressed bytes.
// Alone among the tables here it is not deduplicated, because what it measures
// is the lists rather than the pool they point at: the archive really does
// publish a separate Packages for every series, pocket, component and
// architecture, and an Architecture: all package really is a stanza in each of
// them.  Pocket is a plain index rather than a mask for the same reason -- an
// index file belongs to exactly one suite.
function scanIndex(fn) {
  const rows = DATA.byIndex.rows;
  for (let i = 0; i < rows.length; i += 9) {
    if (!state.series.has(rows[i + 1])) continue;
    if (!state.arch.has(rows[i + 2])) continue;
    if (!state.comp.has(rows[i + 3])) continue;
    if (!state.pocket.has(rows[i + 4])) continue;
    fn(rows[i], rows[i + 1], rows[i + 2], rows[i + 3], rows[i + 4],
       rows[i + 5], rows[i + 6], rows[i + 7], rows[i + 8]);
  }
}

/** timeline(), but over index files; same shape, so splitLines() fits it.

    Takes the dimension to split on rather than reading the "one line per"
    control, because this tab draws pocket and component as lines too, and an
    index file has exactly one of each -- so any of the four is a clean split
    with no double counting.
 */
function indexTimelineBy(sp, keyOf) {
  const perKey = new Map();
  const blank = () => ({ files: 0, n: 0, kn: 0, csize: 0, usize: 0 });
  const totals = D.snapshots.map(blank);

  function add(key, snap, n, kn, c, u) {
    let per = perKey.get(key);
    if (!per) { per = D.snapshots.map(() => null); perKey.set(key, per); }
    let cell = per[snap];
    if (!cell) cell = per[snap] = blank();
    cell.files++; cell.n += n; cell.kn += kn; cell.csize += c; cell.usize += u;
  }

  scanIndex((snap, ser, arch, comp, pocket, n, kn, c, u) => {
    const t = totals[snap];
    t.files++; t.n += n; t.kn += kn; t.csize += c; t.usize += u;
    add(keyOf(ser, arch, comp, pocket), snap, n, kn, c, u);
  });
  return { perKey, totals, split: sp };
}

function indexTimeline() {
  const sp = split();
  return indexTimelineBy(
    sp, (ser, arch) => (sp.key === "arch" ? arch : ser));
}

/** The two splits this tab adds, as the shape splitLines() expects. */
function pocketSplit() {
  return { key: "pocket", names: DATA.pockets, sel: state.pocket,
           slots: pocketSlots, label: "pocket" };
}
function componentSplit() {
  return { key: "component", names: D.components, sel: state.comp,
           slots: compSlots, label: "component" };
}

/** kernel/total bytes at one snapshot, deduplicated across the selection. */
function snapshotTotals(snap) {
  const cur = { kernel: 0, total: 0, n: 0, kn: 0 };
  scanClass((s, smask, arch, cls, n, v) => {
    if (s !== snap) return;
    cur.total += v;
    cur.n += n;
    if (cls !== OTHER) { cur.kernel += v; cur.kn += n; }
  });
  return cur;
}

/** Per-snapshot totals, plus a per-key breakdown along the split dimension.

    The totals count each file once however many series or architectures share
    it.  The per-key numbers deliberately do not: a file both jammy and noble
    reference is part of jammy's size and part of noble's, so it is added to
    each.  That is why the lines do not sum to the total, and why the archive
    view reads the totals rather than adding the lines up.
 */
function timeline() {
  const sp = split();
  const perKey = new Map();
  const totals = D.snapshots.map(() => ({ kernel: 0, total: 0, n: 0, kn: 0 }));

  function add(key, snap, cls, n, v) {
    let per = perKey.get(key);
    if (!per) { per = D.snapshots.map(() => null); perKey.set(key, per); }
    let cell = per[snap];
    if (!cell) cell = per[snap] = { kernel: 0, total: 0, n: 0, kn: 0 };
    cell.total += v;
    cell.n += n;
    if (cls !== OTHER) { cell.kernel += v; cell.kn += n; }
  }

  scanClass((snap, smask, arch, cls, n, v) => {
    const t = totals[snap];
    t.total += v;
    t.n += n;
    if (cls !== OTHER) { t.kernel += v; t.kn += n; }
    if (sp.key === "arch") {
      add(arch, snap, cls, n, v);
    } else {
      for (const ser of state.series) {
        if (smask >> ser & 1) add(ser, snap, cls, n, v);
      }
    }
  });
  return { perKey, totals, split: sp };
}

/* ---------------------------------------------------------------- svg bits */

const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}

/** Bar anchored at the baseline with only its data end rounded. */
function barPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w));
  return "M" + x + "," + y +
         "h" + (w - r) + "a" + r + "," + r + " 0 0 1 " + r + "," + r +
         "v" + (h - 2 * r) + "a" + r + "," + r + " 0 0 1 " + (-r) + "," + r +
         "h" + (r - w) + "z";
}

/** Nice round tick values from 0 up to at least max.

    The top tick has to sit at or above max, not below it: the chart scales the
    plot to the last tick, so a top tick under the data draws the line off the
    top of the axes.  Ticks are built by multiplying rather than accumulating,
    so 0.1-sized steps do not drift.
 */
function ticks(max, want) {
  if (!(max > 0)) return [0, 1];
  const raw = max / want;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const n = Math.ceil(max / step - 1e-9);
  const out = [];
  for (let i = 0; i <= n; i++) out.push(i * step);
  return out;
}

const tooltip = document.getElementById("tooltip");
function showTip(html, x, y) {
  tooltip.innerHTML = html;
  tooltip.style.opacity = "1";
  const box = tooltip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + box.width > window.innerWidth - 8) left = x - box.width - 14;
  if (top + box.height > window.innerHeight - 8) top = y - box.height - 14;
  tooltip.style.left = Math.max(8, left) + "px";
  tooltip.style.top = Math.max(8, top) + "px";
}
function hideTip() { tooltip.style.opacity = "0"; }

/* -------------------------------------------------------------- line chart */

function lineChart(host, opts) {
  const width = Math.max(560, host.clientWidth || 900);
  const height = opts.height || 300;
  const pad = { top: 12, right: 96, bottom: 30, left: 62 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const svg = el("svg", { width, height, viewBox: "0 0 " + width + " " + height,
                          role: "img", "aria-label": opts.title || "chart" });

  const xs = opts.x;
  const maxY = Math.max(opts.minMax || 0, ...opts.series.flatMap(
    s => s.points.map(p => (p === null ? 0 : p))));
  const yTicks = ticks(maxY, 5);
  const top = yTicks[yTicks.length - 1] || 1;
  const X = i => pad.left + (xs.length === 1 ? plotW / 2 : plotW * i / (xs.length - 1));
  const Y = v => pad.top + plotH - plotH * (v / top);

  for (const t of yTicks) {
    el("line", { x1: pad.left, x2: pad.left + plotW, y1: Y(t), y2: Y(t),
                 stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const label = el("text", { x: pad.left - 8, y: Y(t) + 4, "text-anchor": "end" }, svg);
    label.textContent = opts.fmt(t);
  }
  // x labels: thin them out so they never collide
  const every = Math.max(1, Math.ceil(xs.length / (plotW / 62)));
  xs.forEach((label, i) => {
    if (i % every && i !== xs.length - 1) return;
    const t = el("text", { x: X(i), y: height - 10, "text-anchor": "middle" }, svg);
    t.textContent = label;
  });
  el("line", { x1: pad.left, x2: pad.left + plotW, y1: Y(0), y2: Y(0),
               stroke: "var(--axis)", "stroke-width": 1 }, svg);

  for (const s of opts.series) {
    let d = "", pen = false;
    s.points.forEach((v, i) => {
      if (v === null) { pen = false; return; }
      d += (pen ? "L" : "M") + X(i) + "," + Y(v);
      pen = true;
    });
    if (!d) continue;
    el("path", { d, fill: "none", stroke: s.colour, "stroke-width": 2,
                 "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    // direct label at the last real point
    let last = -1;
    s.points.forEach((v, i) => { if (v !== null) last = i; });
    if (last >= 0) {
      el("circle", { cx: X(last), cy: Y(s.points[last]), r: 3.5, fill: s.colour,
                     stroke: "var(--surface)", "stroke-width": 2 }, svg);
      const t = el("text", { x: X(last) + 9, y: Y(s.points[last]) + 4,
                             class: "endlabel", fill: s.colour }, svg);
      t.textContent = s.name;
    }
  }

  // crosshair + tooltip
  const hair = el("line", { y1: pad.top, y2: pad.top + plotH, stroke: "var(--axis)",
                            "stroke-width": 1, opacity: 0 }, svg);
  const hit = el("rect", { x: pad.left, y: pad.top, width: plotW, height: plotH,
                           fill: "transparent" }, svg);
  hit.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const rel = (ev.clientX - box.left - pad.left) / (plotW || 1);
    const i = Math.max(0, Math.min(xs.length - 1, Math.round(rel * (xs.length - 1))));
    hair.setAttribute("x1", X(i));
    hair.setAttribute("x2", X(i));
    hair.setAttribute("opacity", 1);
    let html = '<div class="tt-title">' + opts.xTitle(i) + "</div>";
    for (const s of opts.series) {
      if (s.points[i] === null) continue;
      html += '<div class="tt-row"><span style="color:' + s.colour + '">●</span>' +
              "<span>" + s.name + "</span><span>" + opts.fmt(s.points[i]) + "</span></div>";
    }
    showTip(html, ev.clientX, ev.clientY);
  });
  hit.addEventListener("mouseleave", () => { hair.setAttribute("opacity", 0); hideTip(); });

  host.innerHTML = "";
  host.appendChild(svg);
}

/* --------------------------------------------------------------- bar chart */

function barChart(host, opts) {
  const items = opts.items;
  if (!items.length) { host.innerHTML = '<div class="empty">Nothing selected.</div>'; return; }
  const width = Math.max(520, host.clientWidth || 900);
  const rowH = 26, gap = 2;
  const pad = { top: 8, right: 120, bottom: 24, left: opts.labelWidth || 150 };
  const height = pad.top + items.length * rowH + pad.bottom;
  const plotW = width - pad.left - pad.right;
  const svg = el("svg", { width, height, viewBox: "0 0 " + width + " " + height,
                          role: "img", "aria-label": opts.title || "chart" });
  const max = Math.max(...items.map(d => Math.max(d.value, d.total || 0)));
  const scale = v => (max > 0 ? plotW * v / max : 0);

  items.forEach((d, i) => {
    const y = pad.top + i * rowH;
    const h = rowH - gap * 2;
    const label = el("text", { x: pad.left - 10, y: y + h / 2 + 4,
                               "text-anchor": "end", class: "axislabel" }, svg);
    label.textContent = d.label;
    if (d.total !== undefined) {
      el("path", { d: barPath(pad.left, y + gap, Math.max(scale(d.total), 1), h, 4),
                   fill: "var(--neutral-fill)" }, svg);
    }
    el("path", { d: barPath(pad.left, y + gap, Math.max(scale(d.value), 1), h, 4),
                 fill: d.colour || "var(--s1)" }, svg);
    const t = el("text", { x: pad.left + Math.max(scale(d.total ?? d.value), 1) + 10,
                           y: y + h / 2 + 4, class: "axislabel" }, svg);
    t.textContent = opts.rowLabel(d);

    const hit = el("rect", { x: pad.left, y, width: plotW, height: rowH,
                             fill: "transparent" }, svg);
    hit.addEventListener("mousemove", ev => showTip(opts.tip(d), ev.clientX, ev.clientY));
    hit.addEventListener("mouseleave", hideTip);
  });

  host.innerHTML = "";
  host.appendChild(svg);
}

/* ----------------------------------------------------------------- filters */

function chipRow(label, values, selected, onToggle, colourFor, extras) {
  const row = document.createElement("div");
  row.className = "frow";
  const name = document.createElement("div");
  name.className = "flabel";
  name.textContent = label;
  row.appendChild(name);
  const chips = document.createElement("div");
  chips.className = "chips";
  values.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", selected.has(i) ? "true" : "false");
    if (colourFor) {
      const sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = colourFor(i) || "var(--muted)";
      b.appendChild(sw);
    }
    b.appendChild(document.createTextNode(v));
    b.addEventListener("click", () => { onToggle(i); render(); });
    chips.appendChild(b);
  });
  const all = document.createElement("button");
  all.className = "chip allnone";
  all.type = "button";
  // "select all"/"select none" rather than "all"/"none": one of the values in
  // the architecture row is itself called "all".
  all.textContent = selected.size === values.length ? "select none" : "select all";
  all.addEventListener("click", () => {
    if (selected.size === values.length) selected.clear();
    else values.forEach((_, i) => selected.add(i));
    render();
  });
  chips.appendChild(all);
  for (const extra of extras || []) {
    const b = document.createElement("button");
    b.className = "chip allnone";
    b.type = "button";
    b.textContent = extra[0];
    b.title = extra[1];
    b.addEventListener("click", () => { extra[2](); render(); });
    chips.appendChild(b);
  }
  row.appendChild(chips);
  return row;
}

function toggler(set) {
  return i => { if (set.has(i)) set.delete(i); else set.add(i); };
}

function buildFilters() {
  const host = document.getElementById("filters");
  host.innerHTML = "";
  host.appendChild(chipRow("Series", D.series, state.series, toggler(state.series),
                           i => seriesColour(i),
                           [["select default",
                             "the series still changing size at the most " +
                             "recent snapshot, which is what the page opens " +
                             "with",
                             () => setTo(state.series, DEFAULTS.series)]]));
  host.appendChild(chipRow("Arch", D.arches, state.arch, toggler(state.arch),
                           i => archColour(i)));
  host.appendChild(chipRow("Pocket", DATA.pockets, state.pocket, toggler(state.pocket)));
  host.appendChild(chipRow("Component", D.components, state.comp, toggler(state.comp)));

  const row = document.createElement("div");
  row.className = "frow";
  const lab = document.createElement("div");
  lab.className = "flabel";
  lab.textContent = "Measure";
  row.appendChild(lab);
  const chips = document.createElement("div");
  chips.className = "chips";
  [["size", "Download size"], ["isize", "Installed size"]].forEach(pair => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = pair[1];
    b.setAttribute("aria-pressed", state.metric === pair[0] ? "true" : "false");
    b.addEventListener("click", () => { state.metric = pair[0]; render(); });
    chips.appendChild(b);
  });
  row.appendChild(chips);
  host.appendChild(row);

  const lines = document.createElement("div");
  lines.className = "frow";
  const llab = document.createElement("div");
  llab.className = "flabel";
  llab.textContent = "One line per";
  lines.appendChild(llab);
  const lchips = document.createElement("div");
  lchips.className = "chips";
  [["series", "Series"], ["arch", "Architecture"]].forEach(pair => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = pair[1];
    b.setAttribute("aria-pressed", state.splitBy === pair[0] ? "true" : "false");
    b.addEventListener("click", () => { state.splitBy = pair[0]; render(); });
    lchips.appendChild(b);
  });
  lines.appendChild(lchips);
  host.appendChild(lines);
}

/* ------------------------------------------------------------------- views */

/** Build the line series for the current split, plus a note about any that
    could not be given a colour. */
function splitLines(tl, pick) {
  const sp = tl.split;
  const drawn = sp.slots.drawable(sp.sel);
  return {
    dropped: sp.sel.size - drawn.length,
    label: sp.label,
    keys: drawn,
    series: drawn.map(k => ({
      name: sp.names[k],
      colour: sp.slots.colour(k),
      points: (tl.perKey.get(k) || []).map(c => (c ? pick(c) : null)),
    })),
  };
}

function dropNote(host, lines) {
  if (!lines.dropped) return;
  note(host, lines.dropped + (lines.dropped === 1 ? " more selected " : " more selected ") +
       lines.label + (lines.dropped === 1 ? " is" : " are") + " not drawn: all " +
       SLOTS + " colour slots are taken, and reusing one would be ambiguous. " +
       "Untick one to free a colour, or use the table view.");
}

function viewTime(host, tl) {
  const xs = D.snapshots.map(shortStamp);
  const shareLines = splitLines(tl, c => (c.total ? 100 * c.kernel / c.total : null));

  const shareCard = card(host, "Kernel share, per " + tl.split.label,
    "Kernel bytes as a percentage of everything selected, one line per " +
    tl.split.label + ", at each snapshot.");
  lineChart(shareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    minMax: 10,
    series: shareLines.series,
  });
  legend(shareCard, shareLines.series.map(l => [l.name, l.colour]));
  dropNote(shareCard, shareLines);

  const absLines = splitLines(tl, c => c.kernel);
  const absCard = card(host, "Kernel bytes, per " + tl.split.label,
    "The same selection in absolute terms, so a rising share can be told apart " +
    "from a shrinking archive.");
  lineChart(absCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: absLines.series,
  });
  legend(absCard, absLines.series.map(l => [l.name, l.colour]));
  if (tl.split.key === "series") {
    note(absCard, "A file that several series share counts towards each of " +
         "them, so these lines add up to more than the archive holds. The " +
         "Whole archive tab counts each file once.");
  }
}

function viewBreakdown(host) {
  snapshotChooser(host, drawBreakdown);
}

function drawBreakdown(host) {
  const snap = state.snap;
  const byClass = new Map(), byArch = new Map(), byFlav = new Map();
  scanClass((s, smask, arch, cls, n, v) => {
    if (s !== snap) return;
    let a = byArch.get(arch);
    if (!a) byArch.set(arch, a = { kernel: 0, total: 0, n: 0 });
    a.total += v;
    if (cls !== OTHER) {
      a.kernel += v;
      a.n += n;
      const c = byClass.get(cls) || { v: 0, n: 0 };
      c.v += v; c.n += n;
      byClass.set(cls, c);
    }
  });
  scanFlavour((s, smask, arch, flav, n, v) => {
    if (s !== snap) return;
    const f = byFlav.get(flav) || { v: 0, n: 0 };
    f.v += v; f.n += n;
    byFlav.set(flav, f);
  });

  const archCard = card(host, "Kernel share by architecture",
    "Solid bar: kernel packages. Faint bar behind it: everything published for " +
    "that architecture. 'all' and 'source' are rows of their own because the " +
    "archive keeps one copy of each, not one per architecture.");
  barChart(archCard, {
    labelWidth: 92,
    items: [...byArch.entries()]
      .sort((a, b) => b[1].total - a[1].total)
      .map(entry => ({
        label: D.arches[entry[0]], value: entry[1].kernel,
        total: entry[1].total, n: entry[1].n,
      })),
    rowLabel: d => pct(d.total ? d.value / d.total : 0) + " of " + bytes(d.total),
    tip: d => '<div class="tt-title">' + d.label + "</div>" +
      '<div class="tt-row"><span>kernel</span><span>' + bytes(d.value) + "</span></div>" +
      '<div class="tt-row"><span>everything</span><span>' + bytes(d.total) + "</span></div>" +
      '<div class="tt-row"><span>share</span><span>' +
      pct(d.total ? d.value / d.total : 0) + "</span></div>" +
      '<div class="tt-row"><span>kernel packages</span><span>' + count(d.n) + "</span></div>",
  });
  legend(archCard, [["kernel packages", "var(--s1)"],
                    ["everything published", "var(--neutral-fill)"]]);

  const clsCard = card(host, "Where the kernel bytes go",
    "Kernel packages by kind. 'objects' is linux-objects-* from " +
    "linux-restricted-modules, the pre-built third-party drivers.");
  barChart(clsCard, {
    labelWidth: 130,
    items: [...byClass.entries()].sort((a, b) => b[1].v - a[1].v)
      .map(entry => ({ label: D.classes[entry[0]], value: entry[1].v, n: entry[1].n })),
    rowLabel: d => bytes(d.value),
    tip: d => '<div class="tt-title">' + d.label + "</div>" +
      '<div class="tt-row"><span>size</span><span>' + bytes(d.value) + "</span></div>" +
      '<div class="tt-row"><span>packages</span><span>' + count(d.n) + "</span></div>",
  });

  const flavCard = card(host, "By kernel flavour",
    "Sources collapsed to the kernel they belong to, so linux-signed-aws and " +
    "linux-restricted-modules-aws count towards linux-aws.");
  barChart(flavCard, {
    labelWidth: 190,
    items: [...byFlav.entries()].sort((a, b) => b[1].v - a[1].v)
      .map(entry => ({ label: D.flavours[entry[0]], value: entry[1].v, n: entry[1].n })),
    rowLabel: d => bytes(d.value),
    tip: d => '<div class="tt-title">' + d.label + "</div>" +
      '<div class="tt-row"><span>size</span><span>' + bytes(d.value) + "</span></div>" +
      '<div class="tt-row"><span>packages</span><span>' + count(d.n) + "</span></div>",
  });
}

function viewTable(host, tl) {
  const sp = tl.split;
  const c = card(host, "Kernel share over time",
    "Every selected " + sp.label + ", including any the charts could not " +
    "colour. The last column counts each file once across the whole selection.");
  const wrap = document.createElement("div");
  wrap.className = "tablewrap";
  const sel = [...sp.sel].sort((a, b) => a - b);
  let html = "<table><thead><tr><th>Snapshot</th>";
  for (const s of sel) html += "<th>" + sp.names[s] + "</th>";
  html += "<th>all selected</th></tr></thead><tbody>";
  D.snapshots.forEach((snapshot, i) => {
    if (!tl.totals[i].total) return;
    html += "<tr><td>" + stamp(snapshot) + "</td>";
    for (const s of sel) {
      const cell = (tl.perKey.get(s) || [])[i];
      html += '<td class="num">' +
        (cell && cell.total ? pct(cell.kernel / cell.total) : "-") + "</td>";
    }
    html += '<td class="num">' + pct(tl.totals[i].kernel / tl.totals[i].total) +
            "</td></tr>";
  });
  html += "</tbody></table>";
  wrap.innerHTML = html;
  c.appendChild(wrap);

  const c2 = card(host, "One snapshot in full",
    "The bytes behind the breakdown charts, at " + stamp(D.snapshots[state.snap]) + ".");
  const rows = new Map();
  scanClass((s, smask, arch, cls, n, v) => {
    if (s !== state.snap) return;
    for (const ser of state.series) {
      if (!(smask >> ser & 1)) continue;
      const key = D.series[ser] + " " + D.arches[arch];
      const r = rows.get(key) || { kernel: 0, total: 0, kn: 0, n: 0 };
      r.total += v; r.n += n;
      if (cls !== OTHER) { r.kernel += v; r.kn += n; }
      rows.set(key, r);
    }
  });
  let h2 = "<table><thead><tr><th>Series</th><th>Arch</th><th>Kernel</th>" +
           "<th>Total</th><th>Share</th><th>Kernel pkgs</th><th>All pkgs</th>" +
           "</tr></thead><tbody>";
  const totals = { kernel: 0, total: 0, kn: 0, n: 0 };
  [...rows.entries()].sort().forEach(entry => {
    const parts = entry[0].split(" "), r = entry[1];
    totals.kernel += r.kernel; totals.total += r.total;
    totals.kn += r.kn; totals.n += r.n;
    h2 += "<tr><td>" + parts[0] + "</td><td>" + parts[1] + '</td><td class="num">' +
      bytes(r.kernel) + '</td><td class="num">' + bytes(r.total) +
      '</td><td class="num">' + pct(r.total ? r.kernel / r.total : 0) +
      '</td><td class="num">' + count(r.kn) + '</td><td class="num">' +
      count(r.n) + "</td></tr>";
  });
  const dedup = snapshotTotals(state.snap);
  h2 += '<tr class="total"><td>deduped</td><td></td><td class="num">' +
    bytes(dedup.kernel) + '</td><td class="num">' + bytes(dedup.total) +
    '</td><td class="num">' + pct(dedup.total ? dedup.kernel / dedup.total : 0) +
    '</td><td class="num">' + count(dedup.kn) + '</td><td class="num">' +
    count(dedup.n) + "</td></tr></tbody></table>";
  const wrap2 = document.createElement("div");
  wrap2.className = "tablewrap";
  wrap2.innerHTML = h2;
  c2.appendChild(wrap2);
}


/* --------------------------------------------------------- whole archive */

/** A range input over the snapshots that survives its own redraws. */
function snapshotChooser(host, redraw) {
  const chooser = card(host, "Snapshot", "");
  const row = document.createElement("div");
  row.className = "slider-row";
  const range = document.createElement("input");
  range.type = "range";
  range.min = 0;
  range.max = D.snapshots.length - 1;
  range.value = state.snap;
  const label = document.createElement("div");
  label.className = "stamp";
  label.textContent = stamp(D.snapshots[state.snap]);
  row.appendChild(label);
  row.appendChild(range);
  chooser.appendChild(row);

  const body = document.createElement("div");
  host.appendChild(body);
  range.addEventListener("input", () => {
    state.snap = +range.value;
    label.textContent = stamp(D.snapshots[state.snap]);
    updateTiles();
    body.innerHTML = "";
    redraw(body);
  });
  redraw(body);
}

function viewArchive(host) {
  const tl = timeline();
  const live = tl.totals.map((c, i) => (c && c.total ? i : -1)).filter(i => i >= 0);
  if (!live.length) {
    host.innerHTML = '<div class="card"><div class="empty">' +
      "Nothing selected.</div></div>";
    return;
  }
  const firstIdx = live[0], lastIdx = live[live.length - 1];
  const first = tl.totals[firstIdx], last = tl.totals[lastIdx];
  const years = (snapDate(D.snapshots[lastIdx]) - snapDate(D.snapshots[firstIdx]))
                / (365.2425 * 86400 * 1000);
  const growth = last.total - first.total;
  const xs = D.snapshots.map(shortStamp);
  const all = state.series.size === D.series.length;

  const sizeCard = card(host, "Total size of the archive",
    (all ? "Every package published across all " + D.series.length + " series"
         : "Every package published across the " + state.series.size +
           " selected series") +
    ", with each file in pool/ counted once however many of them reference it.");
  lineChart(sizeCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: [
      { name: "whole archive", colour: "var(--s1)",
        points: tl.totals.map(c => (c && c.total ? c.total : null)) },
      { name: "kernels", colour: "var(--s2)",
        points: tl.totals.map(c => (c && c.total ? c.kernel : null)) },
    ],
  });
  legend(sizeCard, [["whole archive", "var(--s1)"], ["kernels", "var(--s2)"]]);
  const sign = growth >= 0 ? "+" : "-";
  const rate = years >= 1
    ? ", " + sign + bytes(Math.abs(growth) / years) + " a year"
    : "";
  note(sizeCard,
    bytes(first.total) + " at " + stamp(D.snapshots[firstIdx]) + " to " +
    bytes(last.total) + " at " + stamp(D.snapshots[lastIdx]) + ": " +
    sign + bytes(Math.abs(growth)) + " over " +
    (years >= 1 ? years.toFixed(1) + " years" : Math.round(years * 12) + " months") +
    rate + ", and kernels went from " +
    pct(first.total ? first.kernel / first.total : 0) + " of it to " +
    pct(last.total ? last.kernel / last.total : 0) + ".");

  const splitCard = card(host, "Archive size, per " + tl.split.label,
    tl.split.key === "arch"
      ? "One line per architecture. 'all' and 'source' are lines of their own: " +
        "the archive keeps one copy of each, not one per architecture."
      : "One line per series. A file two series share is counted in both, so " +
        "these add up to more than the line above.");
  const sizeLines = splitLines(tl, c => c.total);
  lineChart(splitCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: sizeLines.series,
  });
  legend(splitCard, sizeLines.series.map(l => [l.name, l.colour]));
  dropNote(splitCard, sizeLines);

  const shareCard = card(host, "Kernel share of the whole archive",
    "The two lines from the first chart as a ratio.");
  lineChart(shareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    minMax: 10,
    height: 240,
    series: [{ name: "kernel share", colour: "var(--s1)",
               points: tl.totals.map(
                 c => (c && c.total ? 100 * c.kernel / c.total : null)) }],
  });

  snapshotChooser(host, body => {
    const byArch = new Map();
    scanClass((snap, smask, arch, cls, n, v) => {
      if (snap !== state.snap) return;
      let a = byArch.get(arch);
      if (!a) byArch.set(arch, a = { kernel: 0, total: 0, n: 0 });
      a.total += v;
      if (cls !== OTHER) { a.kernel += v; a.n += n; }
    });
    const c = card(body, "The archive by architecture",
      "At " + stamp(D.snapshots[state.snap]) + ". Solid bar: kernel packages.");
    barChart(c, {
      labelWidth: 92,
      items: [...byArch.entries()].sort((a, b) => b[1].total - a[1].total)
        .map(entry => ({
          label: D.arches[entry[0]], value: entry[1].kernel,
          total: entry[1].total, n: entry[1].n,
        })),
      rowLabel: d => pct(d.total ? d.value / d.total : 0) + " of " + bytes(d.total),
      tip: d => '<div class="tt-title">' + d.label + "</div>" +
        '<div class="tt-row"><span>kernel</span><span>' + bytes(d.value) + "</span></div>" +
        '<div class="tt-row"><span>everything</span><span>' + bytes(d.total) + "</span></div>" +
        '<div class="tt-row"><span>share</span><span>' +
        pct(d.total ? d.value / d.total : 0) + "</span></div>",
    });
    legend(c, [["kernel packages", "var(--s1)"],
               ["everything published", "var(--neutral-fill)"]]);

    const t = card(body, "The numbers", "");
    const wrap = document.createElement("div");
    wrap.className = "tablewrap";
    let html = "<table><thead><tr><th>Snapshot</th><th>Archive</th>" +
               "<th>Kernels</th><th>Share</th><th>Packages</th></tr></thead><tbody>";
    tl.totals.forEach((cell, i) => {
      if (!cell || !cell.total) return;
      html += "<tr><td>" + stamp(D.snapshots[i]) + '</td><td class="num">' +
        bytes(cell.total) + '</td><td class="num">' + bytes(cell.kernel) +
        '</td><td class="num">' + pct(cell.total ? cell.kernel / cell.total : 0) +
        '</td><td class="num">' + count(cell.n) + "</td></tr>";
    });
    html += "</tbody></table>";
    wrap.innerHTML = html;
    t.appendChild(wrap);
  });
}

/* ------------------------------------------------------------ the lists */

function viewLists(host) {
  const il = indexTimeline();
  const live = il.totals.map((c, i) => (c.files ? i : -1)).filter(i => i >= 0);
  if (!live.length) {
    host.innerHTML = '<div class="card"><div class="empty">' +
      "No index files in this selection. Note that 'all' is not an index " +
      "directory of its own: an Architecture: all package is listed once in " +
      "every binary-&lt;arch&gt; index, so ticking only 'all' leaves nothing " +
      "to measure.</div></div>";
    return;
  }
  const tl = timeline();
  const xs = D.snapshots.map(shortStamp);
  const firstIdx = live[0], lastIdx = live[live.length - 1];
  const first = il.totals[firstIdx], last = il.totals[lastIdx];

  const sizeCard = card(host, "Size of the package lists",
    "The indexes themselves rather than the packages they point at: what apt " +
    "fetches on 'apt update'. Compressed is the .xz the archive publishes, " +
    "which is the copy this tool downloads; mirrors serve a .gz of every list " +
    "as well, so a mirror carries rather more than this.");
  lineChart(sizeCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: [
      { name: "uncompressed", colour: "var(--s2)",
        points: il.totals.map(c => (c.files ? c.usize : null)) },
      { name: "compressed", colour: "var(--s1)",
        points: il.totals.map(c => (c.files ? c.csize : null)) },
    ],
  });
  legend(sizeCard, [["uncompressed", "var(--s2)"],
                    ["compressed (.xz)", "var(--s1)"]]);
  const archiveNow = tl.totals[lastIdx] ? tl.totals[lastIdx].total : 0;
  note(sizeCard,
    count(last.files) + " index files at " + stamp(D.snapshots[lastIdx]) +
    " holding " + bytes(last.csize) + " compressed and " + bytes(last.usize) +
    " raw, up from " + count(first.files) + " and " + bytes(first.csize) +
    " at " + stamp(D.snapshots[firstIdx]) + "." +
    (archiveNow
      ? " The compressed lists are " + pctFine(last.csize / archiveNow) +
        " of the " + bytes(archiveNow) + " of packages they describe."
      : ""));

  const splitCard = card(host, "Package lists, per " + il.split.label,
    "Compressed size, one line per " + il.split.label + ". Nothing is shared " +
    "between the lines: every index belongs to exactly one series and one " +
    "architecture, so unlike the other tabs these do add up to the total.");
  const sizeLines = splitLines(il, c => c.csize);
  lineChart(splitCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: sizeLines.series,
  });
  legend(splitCard, sizeLines.series.map(l => [l.name, l.colour]));
  dropNote(splitCard, sizeLines);
  const allArch = D.arches.indexOf("all");
  if (il.split.key === "arch" && state.arch.has(allArch)) {
    note(splitCard, "'all' has no line because it has no index directory: an " +
         "Architecture: all package is listed under every real architecture, " +
         "and is counted there.");
  }

  const byPocket = indexTimelineBy(pocketSplit(), (s, a, c, p) => p);
  const byComp = indexTimelineBy(componentSplit(), (s, a, c) => c);

  const pocketCard = card(host, "Package lists, per pocket",
    "Compressed size. The release pocket is most of the length of the lists " +
    "and almost none of the kernels in them: it is frozen on release day, so " +
    "every ABI published since lands in -updates and -security instead.");
  const pocketSize = splitLines(byPocket, c => c.csize);
  lineChart(pocketCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: pocketSize.series,
  });
  legend(pocketCard, pocketSize.series.map(l => [l.name, l.colour]));
  dropNote(pocketCard, pocketSize);

  const compCard = card(host, "Package lists, per component",
    "Compressed size. universe is most of what makes the lists long, and " +
    "almost none of what makes them kernels.");
  const compSize = splitLines(byComp, c => c.csize);
  lineChart(compCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: bytes,
    series: compSize.series,
  });
  legend(compCard, compSize.series.map(l => [l.name, l.colour]));
  dropNote(compCard, compSize);

  const entCard = card(host, "Entries in the package lists",
    "One entry per stanza, counted as the indexes list them rather than as " +
    "the pool stores them: a package published to both -updates and -security " +
    "is two entries, and an Architecture: all package is one entry under every " +
    "architecture. That is what makes a list long to parse, and it is not how " +
    "the other tabs count packages.");
  lineChart(entCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: count,
    series: [
      { name: "all entries", colour: "var(--s2)",
        points: il.totals.map(c => (c.files ? c.n : null)) },
      { name: "kernel entries", colour: "var(--s1)",
        points: il.totals.map(c => (c.files ? c.kn : null)) },
    ],
  });
  legend(entCard, [["all entries", "var(--s2)"], ["kernel entries", "var(--s1)"]]);

  const shareCard = card(host, "How much of the lists is kernels",
    "Kernel entries as a share of all entries, against the kernel share of " +
    "the archive's bytes for comparison. Kernel packages are few and enormous, " +
    "so the two answers to 'how much of this is kernels' are nothing alike.");
  lineChart(shareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    minMax: 10,
    height: 260,
    series: [
      { name: "of archive bytes", colour: "var(--s2)",
        points: tl.totals.map(c => (c && c.total ? 100 * c.kernel / c.total : null)) },
      { name: "of list entries", colour: "var(--s1)",
        points: il.totals.map(c => (c.n ? 100 * c.kn / c.n : null)) },
    ],
  });
  legend(shareCard, [["of archive bytes", "var(--s2)"],
                     ["of list entries", "var(--s1)"]]);

  const kshare = c => (c.n ? 100 * c.kn / c.n : null);

  const pocketShareCard = card(host, "Kernel share of the lists, per pocket",
    "The same ratio within each pocket's own indexes. Untick release in the " +
    "filter above and the overall figure jumps to meet these.");
  const pocketShare = splitLines(byPocket, kshare);
  lineChart(pocketShareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    minMax: 10,
    height: 260,
    series: pocketShare.series,
  });
  legend(pocketShareCard, pocketShare.series.map(l => [l.name, l.colour]));
  dropNote(pocketShareCard, pocketShare);

  const compShareCard = card(host, "Kernel share of the lists, per component",
    "restricted is where linux-restricted-modules and its linux-objects-* " +
    "live, which is why it is the most kernel-dense component even though " +
    "main carries the kernels themselves.");
  const compShare = splitLines(byComp, kshare);
  lineChart(compShareCard, {
    x: xs,
    xTitle: i => stamp(D.snapshots[i]),
    fmt: v => v.toFixed(0) + "%",
    minMax: 10,
    height: 260,
    series: compShare.series,
  });
  legend(compShareCard, compShare.series.map(l => [l.name, l.colour]));
  dropNote(compShareCard, compShare);

  snapshotChooser(host, body => {
    const byArch = new Map();
    scanIndex((snap, ser, arch, comp, pocket, n, kn, c, u) => {
      if (snap !== state.snap) return;
      let a = byArch.get(arch);
      if (!a) byArch.set(arch, a = { n: 0, kn: 0, csize: 0, files: 0 });
      a.n += n; a.kn += kn; a.csize += c; a.files++;
    });
    const ac = card(body, "The lists by architecture",
      "At " + stamp(D.snapshots[state.snap]) + ". Solid bar: kernel entries. " +
      "'source' is the Sources indexes; there is no 'all' row because " +
      "Architecture: all packages are listed under each real architecture.");
    barChart(ac, {
      labelWidth: 92,
      items: [...byArch.entries()].sort((a, b) => b[1].n - a[1].n)
        .map(entry => ({
          label: D.arches[entry[0]], value: entry[1].kn,
          total: entry[1].n, csize: entry[1].csize, files: entry[1].files,
        })),
      rowLabel: d => pct(d.total ? d.value / d.total : 0) + " of " +
        count(d.total) + " entries",
      tip: d => '<div class="tt-title">' + d.label + "</div>" +
        '<div class="tt-row"><span>index files</span><span>' + count(d.files) + "</span></div>" +
        '<div class="tt-row"><span>entries</span><span>' + count(d.total) + "</span></div>" +
        '<div class="tt-row"><span>kernel entries</span><span>' + count(d.value) + "</span></div>" +
        '<div class="tt-row"><span>compressed</span><span>' + bytes(d.csize) + "</span></div>",
    });
    legend(ac, [["kernel entries", "var(--s1)"],
                ["every entry", "var(--neutral-fill)"]]);

    const t = card(body, "The numbers", "");
    const wrap = document.createElement("div");
    wrap.className = "tablewrap";
    let html = "<table><thead><tr><th>Snapshot</th><th>Indexes</th>" +
      "<th>Entries</th><th>Kernel</th><th>Share</th><th>Compressed</th>" +
      "<th>Uncompressed</th><th>Of archive</th></tr></thead><tbody>";
    il.totals.forEach((c, i) => {
      if (!c.files) return;
      const arch = tl.totals[i] ? tl.totals[i].total : 0;
      html += "<tr><td>" + stamp(D.snapshots[i]) + '</td><td class="num">' +
        count(c.files) + '</td><td class="num">' + count(c.n) +
        '</td><td class="num">' + count(c.kn) + '</td><td class="num">' +
        pct(c.n ? c.kn / c.n : 0) + '</td><td class="num">' + bytes(c.csize) +
        '</td><td class="num">' + bytes(c.usize) + '</td><td class="num">' +
        (arch ? pctFine(c.csize / arch) : "-") + "</td></tr>";
    });
    html += "</tbody></table>";
    wrap.innerHTML = html;
    t.appendChild(wrap);
  });
}

/* ------------------------------------------------------------ card helpers */

function card(host, title, sub) {
  const c = document.createElement("div");
  c.className = "card";
  const h = document.createElement("h2");
  h.textContent = title;
  c.appendChild(h);
  if (sub) {
    const s = document.createElement("div");
    s.className = "cardsub";
    s.textContent = sub;
    c.appendChild(s);
  }
  const body = document.createElement("div");
  body.className = "chartbox";
  c.appendChild(body);
  host.appendChild(c);
  return body;
}

function legend(host, entries) {
  if (entries.length < 2) return;   // one series is named by its own end label
  const box = document.createElement("div");
  box.className = "legend";
  for (const entry of entries) {
    const item = document.createElement("span");
    item.className = "item";
    const key = document.createElement("span");
    key.className = "key";
    key.style.background = entry[1];
    item.appendChild(key);
    item.appendChild(document.createTextNode(entry[0]));
    box.appendChild(item);
  }
  host.parentNode.appendChild(box);
}

function note(host, text) {
  const n = document.createElement("div");
  n.className = "cardsub";
  n.style.marginTop = "10px";
  n.textContent = text;
  host.parentNode.appendChild(n);
}

/* ------------------------------------------------------------------ render */

function updateTiles() {
  const cur = snapshotTotals(state.snap);
  const archive = state.series.size === D.series.length;
  const scope = archive ? "whole archive" : "selected";
  document.getElementById("tile-kernel").textContent = bytes(cur.kernel);
  document.getElementById("tile-kernel-note").textContent =
    count(cur.kn) + " packages at " + stamp(D.snapshots[state.snap]);
  document.getElementById("tile-other-label").textContent =
    archive ? "REST OF THE ARCHIVE" : "EVERYTHING ELSE";
  document.getElementById("tile-other").textContent = bytes(cur.total - cur.kernel);
  document.getElementById("tile-other-note").textContent =
    count(cur.n - cur.kn) + " packages";
  document.getElementById("tile-share").textContent =
    cur.total ? pct(cur.kernel / cur.total) : "-";
  document.getElementById("tile-share-note").textContent =
    "of " + bytes(cur.total) + " " + scope;
}

function render() {
  // The tab is removed at load for a dataset that predates the index table,
  // but do not make the dispatch depend on that having happened.
  if (state.view === "lists" && !DATA.byIndex) state.view = "time";
  assignSlots();
  buildFilters();
  updateTiles();

  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.view === state.view ? "true" : "false"));

  const host = document.getElementById("views");
  host.innerHTML = "";
  if (!state.series.size || !state.arch.size || !state.pocket.size || !state.comp.size) {
    host.innerHTML = '<div class="card"><div class="empty">' +
      "Select at least one of each filter.</div></div>";
    return;
  }
  if (state.view === "lists") viewLists(host);
  else if (state.view === "archive") viewArchive(host);
  else if (state.view === "breakdown") viewBreakdown(host);
  else if (state.view === "time") viewTime(host, timeline());
  else viewTable(host, timeline());
}

// --from-json can replay a dataset built before the index table existed.
if (!DATA.byIndex) {
  const stale = document.querySelector('.tab[data-view="lists"]');
  if (stale) stale.remove();
  if (state.view === "lists") state.view = "time";
}

document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => { state.view = t.dataset.view; render(); }));

document.getElementById("resetbtn").addEventListener("click", () => {
  resetDefaults();
  render();
});

document.getElementById("themebtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--page").trim() === "#0d0d0d";
  root.setAttribute("data-theme", dark ? "light" : "dark");
  render();
});

document.getElementById("generated").textContent =
  "snapshot.ubuntu.com | " + stamp(D.snapshots[0]) + " to " +
  stamp(D.snapshots[D.snapshots.length - 1]) + " | built " + DATA.generated;

document.getElementById("footer").innerHTML =
  "A package counts as a kernel package when its source ships a binary that " +
  "<code>Provides: linux-image</code>, plus any " +
  "<code>linux-objects-*-&lt;kver&gt;</code> built for a kernel version seen in " +
  "those images - the same rule as the <code>kernel-sizes</code> script.<br>" +
  "A file published to several pockets is counted once, so the totals are what " +
  "the archive actually stores rather than the sum of the indexes.<br>" +
  "Series share one pool/ too, so every total here counts a shared file once " +
  "for the set you have ticked. The one place that does not hold is a " +
  "per-series line or row: a file jammy and noble both reference belongs to " +
  "each of their sizes, so those add up to more than the archive holds.<br>" +
  "Package lists is the exception to all of that. It measures the indexes " +
  "rather than the pool, so it counts stanzas as the archive publishes them: " +
  "once per pocket, and once per architecture for an Architecture: all " +
  "package. Sizes there come from the Release files, not from the packages.";

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});

render();
</script>
</body>
</html>
